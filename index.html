function buildLibrary(){
  const lib=[],seen=new Set();
  for(const[sessionName,plan]of Object.entries(PLAN)){
    if(!plan.sections)continue;
    for(const sec of plan.sections){for(const ss of sec.supersets||[]){for(const ex of ss.exercises||[]){if(!seen.has(ex.name)){seen.add(ex.name);const c=COACHING[ex.name]||WARMUP_COACHING[ex.name]||{};lib.push({name:ex.name,sets:ex.sets,reps:ex.reps,category:c.category||sec.title,muscle:c.muscle||'',sessions:[],tips:c.tips||[]});}const entry=lib.find(e=>e.name===ex.name);if(entry&&!entry.sessions.includes(sessionName))entry.sessions.push(sessionName);}}}
  }
  for(const ex of SWU_EX){if(!seen.has(ex.name)){seen.add(ex.name);const c=COACHING[ex.name]||{};lib.push({name:ex.name,sets:ex.sets,reps:ex.reps,category:'Swim Warm-Up',muscle:c.muscle||'',sessions:['Swim'],tips:c.tips||[]});}}
  // Add warm-up exercises from all three sessions
  const allWarmup=[...WARMUP_A,...WARMUP_B,...WARMUP_C];
  for(const ex of allWarmup){
    if(!seen.has(ex.name)){
      seen.add(ex.name);
      const c=WARMUP_COACHING[ex.name]||{};
      lib.push({name:ex.name,sets:ex.sets,reps:ex.reps,category:'Warm-Up',muscle:c.muscle||'',sessions:['Gym A','Gym B','Gym C'].filter((_,i)=>[WARMUP_A,WARMUP_B,WARMUP_C][i].some(w=>w.name===ex.name)),tips:c.tips||[]});
    }
  }
  return lib.sort((a,b)=>a.name.localeCompare(b.name));
}

// ── GIF COMPONENT ─────────────────────────────────────────────────────────────
function ExerciseGif({exName,color}){
  const images=getExerciseImages(exName);
  const[frame,setFrame]=useState(0);
  const[failed,setFailed]=useState(false);
  // Alternate between the start (0.jpg) and end (1.jpg) stills every 1.2s to imply the movement
  useEffect(()=>{
    if(!images||images.length<2)return;
    const id=setInterval(()=>setFrame(f=>f===0?1:0),1200);
    return()=>clearInterval(id);
  },[exName]);
  if(!images||failed)return(
    <div style={{background:'#0D1B2E',border:`1px solid ${color}22`,borderRadius:10,padding:'12px 14px',marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
      <span style={{fontSize:20}}>💪</span>
      <div>
        <div style={{color:'#475569',fontSize:12}}>No reference image for this one</div>
        <div style={{color:'#334155',fontSize:10,marginTop:2}}>See the coaching cues below</div>
      </div>
    </div>
  );
  return(
    <div style={{borderRadius:12,overflow:'hidden',marginBottom:14,background:'#fff',border:`1px solid ${color}33`,position:'relative'}}>
      <img src={images[frame]} alt={exName} style={{width:'100%',display:'block',maxHeight:280,objectFit:'contain',background:'#fff'}} onError={()=>setFailed(true)}/>
      <div style={{position:'absolute',bottom:6,right:8,color:'#94A3B8',fontSize:9,background:'rgba(255,255,255,0.7)',padding:'1px 5px',borderRadius:4}}>{frame===0?'start':'finish'} · free-exercise-db</div>
    </div>
  );
}

// Two-knock sound via Web Audio API — no external files
function playKnock(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,0.13].forEach(delay=>{
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.type='sine';osc.frequency.value=520;
      gain.gain.setValueAtTime(0,ctx.currentTime+delay);
      gain.gain.linearRampToValueAtTime(0.4,ctx.currentTime+delay+0.01);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+delay+0.22);
      osc.start(ctx.currentTime+delay);osc.stop(ctx.currentTime+delay+0.25);
    });
  }catch{}
}

// Timer uses Date.now() so it survives tab switching, phone lock, music app switches
function Timer({duration,onDone}){
  const endAt=useRef(Date.now()+duration*1000);
  const pauseLeft=useRef(null);
  const[rem,setRem]=useState(duration);
  const[active,setActive]=useState(true);

  // Tick every 250ms — catches up instantly when tab becomes visible
  useEffect(()=>{
    if(!active)return;
    const id=setInterval(()=>{
      const r=Math.max(0,Math.ceil((endAt.current-Date.now())/1000));
      setRem(r);
      if(r<=0){clearInterval(id);playKnock();onDone();}
    },250);
    return()=>clearInterval(id);
  },[active]);

  // Re-check immediately when tab/app regains focus
  useEffect(()=>{
    const onVisible=()=>{
      if(document.visibilityState==='visible'&&active){
        const r=Math.max(0,Math.ceil((endAt.current-Date.now())/1000));
        setRem(r);
        if(r<=0){playKnock();onDone();}
      }
    };
    document.addEventListener('visibilitychange',onVisible);
    return()=>document.removeEventListener('visibilitychange',onVisible);
  },[active]);

  const togglePause=()=>{
    if(active){pauseLeft.current=(endAt.current-Date.now());}
    else{endAt.current=Date.now()+(pauseLeft.current||0);}
    setActive(a=>!a);
  };
  // Add 30s — works whether running (push endAt forward) or paused (extend the frozen remainder)
  const addThirty=()=>{
    if(active){endAt.current+=30000;setRem(Math.max(0,Math.ceil((endAt.current-Date.now())/1000)));}
    else{pauseLeft.current=(pauseLeft.current||0)+30000;setRem(Math.max(0,Math.ceil(pauseLeft.current/1000)));}
  };
  const r=26,circ=2*Math.PI*r,c=rem>duration*0.5?G:rem>duration*0.25?O:R;
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'14px 0',background:'#0A1628',borderRadius:12,border:`1px solid ${c}44`,margin:'10px 0'}}>
      <div style={{color:'#475569',fontSize:11,textTransform:'uppercase',letterSpacing:1.5,marginBottom:8}}>Rest Timer</div>
      <div style={{position:'relative',width:66,height:66}}>
        <svg width="66" height="66" style={{transform:'rotate(-90deg)'}}><circle cx="33" cy="33" r={r} fill="none" stroke="#1E2D40" strokeWidth="5"/><circle cx="33" cy="33" r={r} fill="none" stroke={c} strokeWidth="5" strokeDasharray={`${circ*(rem/duration)} ${circ}`} strokeLinecap="round" style={{transition:'stroke-dasharray 0.3s linear,stroke 0.3s'}}/></svg>
        <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{color:c,fontSize:18,fontFamily:'monospace',fontWeight:700}}>{rem}</span></div>
      </div>
      <div style={{display:'flex',gap:8,marginTop:10}}>
        <button onClick={togglePause} style={{background:'none',border:`1px solid ${c}44`,borderRadius:6,color:c,padding:'4px 12px',cursor:'pointer',fontSize:12}}>{active?'Pause':'Resume'}</button>
        <button onClick={addThirty} style={{background:'none',border:`1px solid ${A}44`,borderRadius:6,color:A,padding:'4px 12px',cursor:'pointer',fontSize:12}}>+30s</button>
        <button onClick={onDone} style={{background:'none',border:'1px solid #1E3A5F',borderRadius:6,color:'#475569',padding:'4px 12px',cursor:'pointer',fontSize:12}}>Skip</button>
      </div>
    </div>
  );
}

// A7 fix: classify progression jump by the exercise's actual muscle group rather than
// pattern-matching the name. The old regex only caught press/curl/fly/row/pulldown/pull-up/
// chop/bird — everything else (lateral raise, pullover, skullcrusher, face pull, pull-apart,
// swing, carry) silently fell through to the 5kg lower-body default, which is wrong advice
// on exercises typically loaded with 4-8kg dumbbells or a light band.
const LOWER_BODY_MUSCLE_KEYWORDS=/glute|hamstring|quad|calf|soleus|gastrocnemius|adductor|abductor/i;
function classifyProgressionJump(exName){
  const entry=COACHING[exName]||WARMUP_COACHING[exName];
  const muscle=entry?entry.muscle:'';
  // Lower-body / leg-dominant muscle groups get the bigger 5kg jump; everything else
  // (chest, back, shoulders, arms, core) gets the smaller 2.5kg jump.
  const isLower=LOWER_BODY_MUSCLE_KEYWORDS.test(muscle);
  return isLower?'5':'2.5';
}

  const complete=done===sets.length&&sets.length>0;
  const jump=classifyProgressionJump(exDef.name);
  const hset=(i,val)=>{
    const s=[...sets];const p=s[i];s[i]=val;
    if(i===0&&!p.done&&val.done&&val.weight&&val.reps){for(let j=1;j<s.length;j++){if(!s[j].weight&&!s[j].reps)s[j]={...s[j],weight:val.weight,reps:val.reps};}}
    onChange({...data,sets:s});
  };
  const addSet=()=>{
    // Prefill from the last set's weight/reps for convenience
    const lastFilled=[...sets].reverse().find(s=>s.weight||s.reps)||{};
    onChange({...data,sets:[...sets,{weight:lastFilled.weight||'',reps:lastFilled.reps||'',done:false}]});
  };
  const removeSet=(i)=>{
    if(sets.length<=1)return;// keep at least one row
    onChange({...data,sets:sets.filter((_,j)=>j!==i)});
  };
  return(
    <div style={{background:'#070E1A',border:`1px solid ${progress?G+'99':complete?c+'55':'#1E2D40'}`,borderRadius:8,padding:'10px 12px',marginBottom:8}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>

function SSBlock({ss,gdata,onChange,color,restDur,hist,secIdx,ssIdx,onDragStart,dragInfo,onRemoveEx,canEdit}){
  const[col,setCol]=useState(false);const[timer,setTimer]=useState(false);const prev=useRef(0);
  const[timerNonce,setTimerNonce]=useState(0);
  const startRest=()=>{setTimerNonce(n=>n+1);setTimer(true);};
  const tot=ss.exercises.reduce((a,ex)=>a+(ex.sets||1),0);
  const dn=ss.exercises.reduce((a,ex)=>a+(((gdata[ex._uid]&&gdata[ex._uid].sets)||[]).filter(s=>s.done).length),0);
  // Auto-collapse when all sets in superset are done
  useEffect(()=>{if(dn===tot&&tot>0){setTimer(false);setCol(true);}},[dn,tot]);
  useEffect(()=>{
    if(ss.exercises.length<=1)return;
    const mins=ss.exercises.map(ex=>((gdata[ex._uid]&&gdata[ex._uid].sets)||[]).filter(s=>s.done).length);
    const m=Math.min(...mins);
    if(m>prev.current&&m>0&&!timer&&dn<tot)setTimer(true);
    prev.current=m;
  },[gdata]);
  return(
    <div style={{marginBottom:12}}>
      <button onClick={()=>setCol(v=>!v)} style={{width:'100%',display:'flex',justifyContent:'space-between',alignItems:'center',background:`linear-gradient(135deg,${color}1A,${color}0A)`,border:`1px solid ${color}33`,borderRadius:10,padding:'9px 13px',cursor:'pointer',marginBottom:col?0:8}}>
        <div style={{textAlign:'left'}}><div style={{color:color,fontSize:13,fontWeight:700}}>{ss.label}</div>{!col&&<div style={{color:'#334155',fontSize:10,marginTop:2}}>{ss.note}</div>}</div>
        <div style={{display:'flex',alignItems:'center',gap:8}}><span style={{color:dn===tot&&tot>0?G:'#475569',fontSize:11,fontFamily:'monospace'}}>{dn}/{tot}</span><span style={{color:'#334155',fontSize:11}}>{col?'+':'−'}</span></div>
      </button>
      {!col&&(
        <div style={{paddingLeft:4}}>
          {ss.exercises.map(ex=>{
            // Cross-session exercise lookup — works for shared exercises like DB Press in both A and A2
            const ps=getPrevExSets(hist,ex.name);
            const cp=canProgressByExercise(hist,ex.name,ex.reps);
            const isDragged=dragInfo&&dragInfo.uid===ex._uid;
            const dropPos=dragInfo&&dragInfo.dropTarget&&dragInfo.dropTarget.uid===ex._uid?dragInfo.dropTarget.position:null;
            return(
              <div key={ex._uid} data-ex-uid={ex._uid} style={{position:'relative',opacity:isDragged?0.35:1,transition:'opacity 0.15s'}}>
                {dropPos==='above'&&<div style={{height:3,background:A,borderRadius:2,marginBottom:4,boxShadow:`0 0 8px ${A}`}}/>}
                <ExCard exDef={ex} data={gdata[ex._uid]||{}} color={color} onChange={val=>onChange(ex._uid,val)} prevSets={ps} progress={cp} hist={hist} onStartRest={startRest} onDragStart={canEdit?(e)=>onDragStart(e,ex._uid):null} onRemove={canEdit&&onRemoveEx?()=>onRemoveEx(ex._uid):null}/>
                {dropPos==='below'&&<div style={{height:3,background:A,borderRadius:2,marginTop:4,boxShadow:`0 0 8px ${A}`}}/>}
              </div>
            );
          })}
          {timer&&<Timer key={timerNonce} duration={restDur} onDone={()=>setTimer(false)}/>}
        </div>
      )}
    </div>
  );
}

// Claude API proxy — routes through Supabase edge function to avoid CORS/key issues on GitHub Pages
const PROXY_URL='https://gvzkxjynpmjnexbmhqgb.supabase.co/functions/v1/claude-proxy';
async function callClaude(system,messages,max_tokens=1000){
  const res=await fetch(PROXY_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SK,'Authorization':'Bearer '+SK},
    body:JSON.stringify({system,messages,max_tokens})
  });
  if(!res.ok)throw new Error('API error '+res.status);
  const d=await res.json();
  if(d.error)throw new Error(d.error);
  return(d.content&&d.content[0]&&d.content[0].text)||'No response.';
}

      const text=await callClaude(system,[{role:'user',content:`SESSION:\n${s}${pt}`}]);

function ClaudePT({messages,setMessages}){
  const[input,setInput]=useState('');
  const[loading,setLoading]=useState(false);
  const bottomRef=useRef(null);

  useEffect(()=>{
    if(bottomRef.current)bottomRef.current.scrollIntoView({behavior:'smooth'});
  },[messages]);

  const send=async()=>{
    const txt=input.trim();
    if(!txt||loading)return;
    const userMsg={role:'user',content:txt,ts:Date.now()};
    const next=[...messages,userMsg];
    setMessages(next);setInput('');setLoading(true);
    try{
      // B5: only send the last 12 conversational turns to the API — keeps cost and latency
      // flat as the chat grows. The full history still displays and is backed up separately.
      const apiMsgs=next.filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role,content:m.content})).slice(-12);
      const text=await callClaude(PT_SYSTEM,apiMsgs,1200);
      setMessages(m=>[...m,{role:'assistant',content:text,ts:Date.now()}]);
    }catch(e){
      setMessages(m=>[...m,{role:'assistant',content:'Error: '+e.message,ts:Date.now()}]);
    }
    setLoading(false);
  };

  const renderMsg=content=>{
    return content.split('\n').map((line,i)=>{
      if(!line.trim())return <div key={i} style={{height:5}}/>;
      const parts=line.split(/\*\*(.*?)\*\*/g);
      return <div key={i} style={{marginBottom:3,lineHeight:1.6}}>{parts.map((x,j)=>j%2===1?<span key={j} style={{color:'#E2E8F0',fontWeight:700}}>{x}</span>:<span key={j}>{x}</span>)}</div>;
    });
  };

  return(
    <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 130px)'}}>
      {/* Header */}
      <div style={{padding:'12px 20px 8px',borderBottom:'1px solid #1E2D40',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:G,flexShrink:0}}/>
          <span style={{color:'#E2E8F0',fontSize:14,fontWeight:700}}>Claude PT</span>
          <span style={{color:'#334155',fontSize:11,marginLeft:4}}>AI Personal Trainer</span>
        </div>
        <div style={{color:'#1E3A5F',fontSize:10,marginTop:3}}>Post-session feedback appears here automatically</div>
      </div>

      {/* Messages */}
      <div style={{flex:1,overflowY:'auto',padding:'12px 20px'}}>
        {messages.length===0&&(
          <div style={{textAlign:'center',padding:'40px 0 20px'}}>
            <div style={{fontSize:28,marginBottom:10}}>💪</div>
            <div style={{color:'#475569',fontSize:13,marginBottom:6}}>Your AI PT is ready</div>
            <div style={{color:'#334155',fontSize:12,lineHeight:1.6}}>Ask about your training, nutrition, recovery, or check in on progress. Post-session feedback will also appear here automatically.</div>
            <div style={{marginTop:16,display:'flex',flexDirection:'column',gap:6}}>
              {['How should I eat on rest days?','What should I focus on in Week 2?','My right shoulder felt tight today — is that normal?','How do I know if I\'m recovering enough?'].map((q,i)=>(
                <button key={i} onClick={()=>{setInput(q);}} style={{background:'#0D1B2E',border:'1px solid #1E3A5F',borderRadius:8,color:'#475569',padding:'8px 12px',cursor:'pointer',fontSize:12,textAlign:'left'}}>{q}</button>
              ))}
            </div>
          </div>
        )}
        {messages.map((msg,i)=>(
          <div key={i} style={{marginBottom:14,display:'flex',flexDirection:'column',alignItems:msg.role==='user'?'flex-end':'flex-start'}}>
            {msg.role==='system-note'?(
              <div style={{background:'#0A1628',border:'1px solid #1E2D40',borderRadius:8,padding:'8px 12px',maxWidth:'95%',width:'100%'}}>
                <div style={{color:'#38BDF8',fontSize:10,textTransform:'uppercase',letterSpacing:1,marginBottom:6,fontWeight:700}}>Post-Session Feedback</div>
                <div style={{color:'#94A3B8',fontSize:12}}>{renderMsg(msg.content)}</div>
              </div>
            ):(
              <div style={{maxWidth:'85%',background:msg.role==='user'?A+'22':'#0D1B2E',border:`1px solid ${msg.role==='user'?A+'44':'#1E2D40'}`,borderRadius:msg.role==='user'?'12px 12px 4px 12px':'12px 12px 12px 4px',padding:'10px 13px'}}>
                <div style={{color:msg.role==='user'?A:'#94A3B8',fontSize:13,lineHeight:1.65}}>{renderMsg(msg.content)}</div>
              </div>
            )}
          </div>
        ))}
        {loading&&(
          <div style={{display:'flex',gap:5,padding:'8px 0'}}>
            {[0,1,2].map(i=><div key={i} style={{width:6,height:6,borderRadius:'50%',background:A,animation:`pulse 1.2s ease-in-out ${i*0.2}s infinite`}}/>)}

        )}
        <div ref={bottomRef}/>
      </div>

      {/* Input */}
      <div style={{padding:'10px 20px 24px',borderTop:'1px solid #1E2D40',flexShrink:0,background:'#070E1A'}}>
        <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
          <textarea
            placeholder="Ask your PT anything..."
            value={input}
            onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}}
            style={{flex:1,background:'#0D1B2E',border:'1px solid #1E3A5F',borderRadius:10,color:'#E2E8F0',padding:'10px 12px',fontSize:13,outline:'none',resize:'none',minHeight:42,maxHeight:120,lineHeight:1.5,boxSizing:'border-box'}}

            style={{width:40,height:40,borderRadius:10,background:input.trim()&&!loading?A+'33':'#0D1B2E',border:`1px solid ${input.trim()&&!loading?A:'#1E3A5F'}`,color:input.trim()&&!loading?A:'#334155',cursor:input.trim()&&!loading?'pointer':'default',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            ↑
          </button>
        </div>
        <div style={{color:'#1E3A5F',fontSize:9,marginTop:5,textAlign:'center'}}>Enter to send · Shift+Enter for new line</div>
      </div>
    </div>
  );
}

// Format minutes as "1h 05m" or "42m"
function fmtDur(mins){
  if(!mins||mins<1)return null;
  const h=Math.floor(mins/60),m=mins%60;
  return h>0?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m`;
}
// Live elapsed-time ticker shown in the log header during an active session
function LiveElapsed({startMs,color}){
  const[now,setNow]=useState(Date.now());
  useEffect(()=>{const id=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(id);},[]);
  if(!startMs)return null;
  const totalSec=Math.max(0,Math.floor((now-startMs)/1000));
  const h=Math.floor(totalSec/3600),m=Math.floor((totalSec%3600)/60),s=totalSec%60;
  const txt=h>0?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;
  return <span style={{color:color||A,fontSize:12,fontFamily:'monospace',fontWeight:700}}>⏱ {txt}</span>;
}

          <div style={{flex:1,marginRight:12}}>
            <div style={{color:'#CBD5E1',fontSize:13,fontWeight:600}}>Apple Watch workout reminder</div>
            <div style={{color:'#64748B',fontSize:11,marginTop:2}}>Prompts to start Watch tracking on your first set</div>
          </div>
          <button onClick={()=>{const next=!healthReminderOff;setHealthReminderOff(next);try{localStorage.setItem('tl-health-reminder-disabled',next?'1':'0');}catch{}}} style={{width:48,height:28,borderRadius:14,border:'none',background:healthReminderOff?'#1E2D40':G,cursor:'pointer',position:'relative',flexShrink:0,transition:'background 0.2s'}}>
            <div style={{width:22,height:22,borderRadius:'50%',background:'#fff',position:'absolute',top:3,left:healthReminderOff?3:23,transition:'left 0.2s'}}/>
          </button>
        </div>

        {/* Data */}
        <div style={{color:'#475569',fontSize:10,textTransform:'uppercase',letterSpacing:1.5,marginBottom:8}}>Data</div>
        <div style={{background:'#0D1B2E',border:'1px solid #1E2D40',borderRadius:10,padding:'12px 14px',marginBottom:20}}>
          <button onClick={exportCsv} style={{width:'100%',padding:'11px',background:A+'18',border:`1px solid ${A}55`,borderRadius:8,color:A,fontSize:13,fontWeight:600,cursor:'pointer',marginBottom:6}}>Export all sessions as CSV</button>
          <div style={{color:'#334155',fontSize:11,textAlign:'center'}}>{hist.length} sessions stored</div>
        </div>

        <div style={{color:'#334155',fontSize:10,textAlign:'center',fontFamily:'monospace'}}>Training Log · single-user · chris-yqp5rrpt</div>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const[screen,setScreen]=useState('home');
  const[atype,setAtype]=useState(null);
  const[week,setWeek]=useState(1);
  const[startDate,setStartDate]=useState('');
  const[showDP,setShowDP]=useState(false);
  const[hist,setHist]=useState([]);
  const[gdata,setGdata]=useState({});
  const[cdata,setCdata]=useState({});
  const[wnotes,setWnotes]=useState('');
  const[sessionDate,setSessionDate]=useState('');
  const[sphase,setSphase]=useState(0);
  const[restDur,setRestDur]=useState(()=>{try{const v=parseInt(localStorage.getItem('tl-rest-default'));return v>0?v:90;}catch{return 90;}});
  const[done2,setDone2]=useState(null);
  // Session start timestamp — persisted in the draft so elapsed time survives a resume
  const[sessionStart,setSessionStart]=useState(null);
  // Settings screen + bodyweight log
  const[showSettings,setShowSettings]=useState(false);
  const[bwLog,setBwLog]=useState(()=>{try{return JSON.parse(localStorage.getItem('tl-bw-log')||'[]');}catch{return[];}});
  const[healthReminderOff,setHealthReminderOff]=useState(()=>{try{return localStorage.getItem('tl-health-reminder-disabled')==='1';}catch{return false;}});
  // B2: connection-error banner — set true when a load/read fails so a Supabase pause never looks like data loss
  const[dbError,setDbError]=useState(false);
  const[histFilter,setHistFilter]=useState('All');
  // Custom-session state — holds the active session's structure with stable UIDs so reordering preserves logged data
  const[customSections,setCustomSections]=useState(null);
  // Apple Health watch-workout reminder
  const[showHealthReminder,setShowHealthReminder]=useState(false);
  const[healthReminderShown,setHealthReminderShown]=useState(false);
  // Add Exercise picker
  const[addPickerCtx,setAddPickerCtx]=useState(null);// {secIdx, ssIdx} or {secIdx, ssIdx:'new'} or null
  // Drag-and-drop state — pointer-events-based, works on mouse + touch
  const[dragInfo,setDragInfo]=useState(null);// {uid, currentX, currentY, dropTarget:{uid,position}|null}
  // Plan mode — switches the home grid + week strip between Home / Travel / Italy plans
  const[planMode,setPlanMode]=useState(()=>{
    try{
      const v=localStorage.getItem('tl-plan-mode');
      if(v==='travel'||v==='italy'||v==='home')return v;
      // Migrate from the old boolean travel-mode key if present
      if(localStorage.getItem('tl-travel-mode')==='1')return 'travel';
      return 'home';
    }catch{return 'home';}
  });
  const switchMode=(m)=>{setPlanMode(m);try{localStorage.setItem('tl-plan-mode',m);}catch{}};
  const activeDMAP=planMode==='travel'?DMAP_TRAVEL:planMode==='italy'?DMAP_ITALY:planMode==='london'?DMAP_LONDON:DMAP;
  const showInMode=(p)=>{if(p.common)return true;if(planMode==='travel')return!!p.travel;if(planMode==='italy')return!!p.italy;if(planMode==='london')return!!p.london;return!p.travel&&!p.italy&&!p.london;};
  // Archived sessions — hidden from the grid but fully preserved in PLAN and in history
  const[archived,setArchived]=useState(()=>{
    try{const v=localStorage.getItem('tl-archived');return v?JSON.parse(v):[];}catch{return[];}
  });
  const[showArchived,setShowArchived]=useState(false);
  const toggleArchived=(name)=>{
    setArchived(prev=>{
      const next=prev.includes(name)?prev.filter(n=>n!==name):[...prev,name];
      try{localStorage.setItem('tl-archived',JSON.stringify(next));}catch{}
      return next;
    });
  };
  const isArchived=(name)=>archived.includes(name);
  const[view,setView]=useState(null);
  const[saving,setSaving]=useState(false);
  const[loaded,setLoaded]=useState(false);
  const[pendingCount,setPendingCount]=useState(getPending().length);
  const[syncing,setSyncing]=useState(false);
  const[ptMessages,setPtMessages]=useState(()=>{
    try{
      // Try localStorage first, fall back to sessionStorage
      const s=localStorage.getItem('tl-pt-msgs')||sessionStorage.getItem('tl-pt-msgs');
      return s?JSON.parse(s):[];
    }catch{return[];}
  });
  const userId=uid();const asr=useRef(null);

  // Manual retry handler — triggered from the banner
  const retrySync=useCallback(async()=>{
    setSyncing(true);
    const r=await syncPendingQueue();
    setPendingCount(r.remaining);
    if(r.synced>0){
      // Re-fetch the canonical session list so any newly-synced rows show up correctly
      try{
        const rows=await db('GET',`/sessions?user_id=eq.${userId}&order=session_date.desc`);
        if(rows)setHist(rows);
      }catch{}
    }
    setSyncing(false);
  },[userId]);

  // Persist PT messages to both local storages (fast cache)
  useEffect(()=>{
    try{
      const data=JSON.stringify(ptMessages.slice(-100));
      localStorage.setItem('tl-pt-msgs',data);
      sessionStorage.setItem('tl-pt-msgs',data);
    }catch{}
  },[ptMessages]);
  // Debounced Supabase backup — reinstall-proof. Guarded so it doesn't fire before the
  // initial DB load has merged in any cloud history (which would overwrite it with a stale/empty set).
  const ptBackupTimer=useRef(null);
  const ptReadyForBackup=useRef(false);
  useEffect(()=>{
    if(!ptReadyForBackup.current)return;
    if(ptBackupTimer.current)clearTimeout(ptBackupTimer.current);
    ptBackupTimer.current=setTimeout(()=>{saveChatBackup(userId,ptMessages).catch(()=>{});},1500);
  },[ptMessages]);
  const addPtFeedback=useCallback(text=>{setPtMessages(m=>[...m,{role:'system-note',content:text,ts:Date.now()}]);},[]);

  useEffect(()=>{
    (async()=>{
      try{
        const sd=localStorage.getItem('tl-start');
        if(sd){setStartDate(sd);setWeek(calcWeek(sd));}
        // First — try to sync any pending sessions from previous failed saves
        const initialPending=getPending();
        if(initialPending.length){
          const r=await syncPendingQueue();
          setPendingCount(r.remaining);
        }
        // A5: if a previous delDraft() failed while offline, the server-side draft row may
        // still exist even though that session already finished and synced. Retry the delete
        // before trusting whatever the /drafts fetch returns.
        let draftDeleteStillPending=false;
        try{
          if(localStorage.getItem('tl-draft-delete-pending')==='1'){
            await db('DELETE',`/drafts?user_id=eq.${userId}`);
            localStorage.removeItem('tl-draft-delete-pending');
          }
        }catch{draftDeleteStillPending=true;}
        const rows=await db('GET',`/sessions?user_id=eq.${userId}&order=session_date.desc`);
        if(rows&&rows.length)setHist(rows);
        setDbError(false);// reached the DB successfully
        // Recover the plan start date from the oldest session if localStorage was wiped
        // (iOS clears PWA storage on icon delete/reinstall — this stopped the week resetting to 1).
        if(!sd&&rows&&rows.length){
          const oldest=rows[rows.length-1].session_date;
          const recovered=new Date(oldest).toISOString().slice(0,10);
          localStorage.setItem('tl-start',recovered);
          setStartDate(recovered);
          setWeek(calcWeek(recovered));
        }
        // Restore PT chat from the cloud backup. If localStorage was wiped (reinstall) the cloud
        // copy repopulates it; otherwise we keep whichever source has more messages so we never
        // lose the newer of the two. Only after this do we allow backups to fire.
        try{
          const cloudChat=await loadChatBackup(userId);
          if(cloudChat&&cloudChat.length){
            setPtMessages(local=>cloudChat.length>=local.length?cloudChat:local);
          }
        }catch{}
        ptReadyForBackup.current=true;
        // Skip restoring a draft this load if we couldn't confirm the stale one was cleared —
        // safer to make the user re-open a genuinely active session than risk a duplicate finish.
        const drafts=draftDeleteStillPending?null:await db('GET',`/drafts?user_id=eq.${userId}`);
        if(drafts&&drafts.length){
          const dr=drafts[0];setAtype(dr.type);
          const d=dr.data||{};
          // Restore customSections if present, otherwise initialise from PLAN (old draft format)
          if(d.customSections){
            setCustomSections(d.customSections);
            setGdata(d.gymData||{});// already uid-keyed if customSections present
          }else if(isGymSession(dr.type)&&PLAN[dr.type]){
            // Old-format draft: re-init customSections, drop the position-keyed gdata (will be lost — rare edge case)
            setCustomSections(initCustomSections(PLAN[dr.type].sections));
            setGdata({});
          }
          // A4: restore the original session date — old drafts saved before this fix won't have
          // one, so fall back to today rather than leaving it blank (which finish() would silently
          // save as today anyway, but now it's explicit and visible in the date picker).
          setSessionDate(d.sessionDate||new Date().toISOString().slice(0,10));
          setSessionStart(d.sessionStart||Date.now());
          setCdata(d.cardioData||{});setWnotes(d.workoutNotes||'');setSphase(d.swimPhase||0);setScreen('log');
        }
      }catch(e){console.error('Load failed:',e);setDbError(true);}
      setLoaded(true);
    })();
  },[]);

  const applyStart=date=>{setStartDate(date);localStorage.setItem('tl-start',date);setWeek(calcWeek(date));setShowDP(false);};
  // Persist the rest-timer default whenever it changes
  useEffect(()=>{try{localStorage.setItem('tl-rest-default',String(restDur));}catch{}},[restDur]);
  // Persist bodyweight log
  useEffect(()=>{try{localStorage.setItem('tl-bw-log',JSON.stringify(bwLog));}catch{}},[bwLog]);

  // B2: manual DB reconnect — re-fetches sessions and clears the error banner on success
  const retryDbConnection=useCallback(async()=>{
    try{
      const rows=await db('GET',`/sessions?user_id=eq.${userId}&order=session_date.desc`);
      if(rows)setHist(rows);
      setDbError(false);
    }catch(e){setDbError(true);}
  },[userId]);

  // Add a bodyweight entry (fasted-morning reminder lives in the Settings UI)
  const addBwEntry=(weight,bf)=>{
    const w=parseFloat(weight);if(!w)return;
    const entry={date:new Date().toISOString().slice(0,10),weight:w,bf:parseFloat(bf)||null};
    setBwLog(log=>[entry,...log.filter(e=>e.date!==entry.date)].sort((a,b)=>b.date.localeCompare(a.date)));
  };

  // Wave 4: export all sessions as CSV (client-side, no server dependency)
  const exportCsv=()=>{
    const rows=[['date','type','week','duration_min','section','superset','exercise','set','weight_kg','reps','done','rpe']];
    for(const s of [...hist].reverse()){
      const dur=(s.data&&s.data.durationMin)||'';
      if(s.data&&s.data.sections){
        for(const sec of s.data.sections){
          for(const ss of sec.supersets||[]){
            for(const ex of ss.exercises||[]){
              const sets=ex.sets||[];
              if(sets.length===0){rows.push([s.session_date.slice(0,10),s.type,s.week,dur,sec.title,ss.label,ex.name,'','','','',ex.rpe||'']);}
              sets.forEach((st,i)=>rows.push([s.session_date.slice(0,10),s.type,s.week,dur,sec.title,ss.label,ex.name,i+1,st.weight||'',st.reps||'',st.done?'yes':'no',ex.rpe||'']));
            }
          }
        }
      }else{
        // cardio session — flatten the key metrics
        rows.push([s.session_date.slice(0,10),s.type,s.week,dur,'cardio','','',( ''),s.data&&s.data.distance||'',s.data&&s.data.duration||'','','']);
      }
    }
    const csv=rows.map(r=>r.map(cell=>{const v=String(cell);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`training-log-${new Date().toISOString().slice(0,10)}.csv`;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
  const saveDraft=useCallback(async(type,w,data)=>{if(!type)return;try{await db('POST','/drafts?on_conflict=user_id',{user_id:userId,type,week:w,data,updated_at:new Date().toISOString()});}catch{}},[userId]);
  useEffect(()=>{if(atype&&screen==='log'){if(asr.current)clearTimeout(asr.current);asr.current=setTimeout(()=>saveDraft(atype,week,{gymData:gdata,cardioData:cdata,workoutNotes:wnotes,swimPhase:sphase,customSections,sessionDate,sessionStart}),800);}},[gdata,cdata,wnotes,sphase,customSections,sessionDate,sessionStart]);
  const delDraft=async()=>{try{await db('DELETE',`/drafts?user_id=eq.${userId}`);try{localStorage.removeItem('tl-draft-delete-pending');}catch{}}catch{try{localStorage.setItem('tl-draft-delete-pending','1');}catch{}}};

  // ── Custom session helpers ────────────────────────────────────────────────
  // Deep-clone PLAN sections and stamp each exercise with a stable UID.
  // The UID lets gdata follow the exercise when reordered or moved between supersets.
  const initCustomSections=(sections)=>{
    let counter=0;
    return sections.map(sec=>({
      ...sec,
      supersets:sec.supersets.map(ss=>({
        ...ss,
        exercises:ss.exercises.map(ex=>({...ex,_uid:`ex-${Date.now()}-${counter++}`}))
      }))
    }));
  };

  // True if there's a live session with actual logged data worth protecting
  const hasLiveProgress=()=>{
    if(!atype)return false;
    // Any completed set in gym data, or any cardio field filled in
    const gymProgress=Object.values(gdata).some(ex=>((ex&&ex.sets)||[]).some(s=>s.weight||s.reps||s.done));
    const cardioProgress=cdata&&Object.values(cdata).some(v=>v!==''&&v!=null&&(typeof v!=='object'));
    return gymProgress||cardioProgress;
  };

  const startSess=type=>{
    // If this exact session is already live, just go back to it — never re-initialise (which would wipe logged sets)
    if(atype===type){setScreen('log');return;}
    // If a DIFFERENT session is live with real progress, protect it — confirm before discarding
    if(hasLiveProgress()){
      const ok=confirm(`You have a live ${atype} session with logged sets. Starting ${type} will discard it. Continue?`);
      if(!ok){setScreen('log');return;}// bounce them back into their live session
    }
    setAtype(type);
    setGdata({});
    setCdata({});
    setWnotes('');
    setSessionDate(new Date().toISOString().slice(0,10));
    setSessionStart(Date.now());
    // Initialise customSections for gym sessions only (cardio sessions don't use it)
    if(isGymSession(type)&&PLAN[type]&&PLAN[type].sections){
      setCustomSections(initCustomSections(PLAN[type].sections));
    }else{
      setCustomSections(null);
    }
    setHealthReminderShown(false);
    setShowHealthReminder(false);
    setScreen('log');
  };

  // gdata is now keyed by uid: {[uid]: {sets, rpe, notes}}
  const hgc=(uid,val)=>setGdata(d=>({...d,[uid]:val}));

  // Detect first set completion to fire Apple Health reminder
  useEffect(()=>{
    if(!atype||healthReminderShown)return;
    if(healthReminderOff)return;
    // Don't prompt for Mobility (no Watch workout makes sense) or for backdated sessions
    if(atype==='Mobility')return;
    if(sessionDate&&sessionDate!==new Date().toISOString().slice(0,10))return;
    // Count total done sets across all exercises in current session
    const totalDone=Object.values(gdata).reduce((a,ex)=>a+((ex&&ex.sets)||[]).filter(s=>s.done).length,0);
    if(totalDone>0){
      setHealthReminderShown(true);
      setShowHealthReminder(true);
    }
  },[gdata,atype,healthReminderShown,healthReminderOff,sessionDate]);

  // Add a new exercise to a target superset (or as a new single-exercise superset)
  const addExerciseToSession=(secIdx,ssIdx,exName)=>{
    if(!customSections)return;
    const newEx={name:exName,sets:3,reps:'10-12',_uid:`ex-${Date.now()}-add`};
    setCustomSections(secs=>secs.map((sec,si)=>{
      if(si!==secIdx)return sec;
      if(ssIdx==='new'){
        // Append a fresh single-exercise superset to the end of this section
        return{...sec,supersets:[...sec.supersets,{label:'Added Exercise',note:'Manually added during session',exercises:[newEx]}]};
      }
      return{...sec,supersets:sec.supersets.map((ss,ssi)=>ssi===ssIdx?{...ss,exercises:[...ss.exercises,newEx]}:ss)};
    }));
    setAddPickerCtx(null);
  };

  // Remove an exercise by uid (also clears its gdata entry). Empty supersets get pruned.
  const removeExerciseByUid=(uid)=>{
    setCustomSections(secs=>secs.map(sec=>({
      ...sec,
      supersets:sec.supersets.map(ss=>({...ss,exercises:ss.exercises.filter(ex=>ex._uid!==uid)})).filter(ss=>ss.exercises.length>0)
    })));
    setGdata(d=>{const n={...d};delete n[uid];return n;});
  };

  // Move an exercise (drag-and-drop reorder). position: 'above' | 'below' of targetUid
  const moveExerciseToTarget=(sourceUid,targetUid,position)=>{
    if(sourceUid===targetUid)return;
    setCustomSections(secs=>{
      // Locate source and target
      let srcSi=-1,srcSsi=-1,srcEi=-1,srcEx=null;
      let tgtSi=-1,tgtSsi=-1,tgtEi=-1;
      for(let si=0;si<secs.length;si++){
        if(secs[si].isWarmup)continue;// don't allow moving warmup exercises
        for(let ssi=0;ssi<secs[si].supersets.length;ssi++){
          for(let ei=0;ei<secs[si].supersets[ssi].exercises.length;ei++){
            const u=secs[si].supersets[ssi].exercises[ei]._uid;
            if(u===sourceUid){srcSi=si;srcSsi=ssi;srcEi=ei;srcEx=secs[si].supersets[ssi].exercises[ei];}
            if(u===targetUid){tgtSi=si;tgtSsi=ssi;tgtEi=ei;}
          }
        }
      }
      if(srcSi===-1||tgtSi===-1)return secs;
      // Build new structure: remove from source first
      const out=secs.map((sec,si)=>({
        ...sec,
        supersets:sec.supersets.map((ss,ssi)=>{
          if(si===srcSi&&ssi===srcSsi)return{...ss,exercises:ss.exercises.filter((_,ei)=>ei!==srcEi)};
          return{...ss,exercises:[...ss.exercises]};
        })
      }));
      // Adjust target index if source was before it in same superset
      let insertIdx=tgtEi;
      if(srcSi===tgtSi&&srcSsi===tgtSsi&&srcEi<tgtEi)insertIdx-=1;
      if(position==='below')insertIdx+=1;
      out[tgtSi].supersets[tgtSsi].exercises.splice(insertIdx,0,srcEx);
      return out;
    });
  };

  // ── Drag-and-drop handlers (pointer events — work on touch + mouse) ───────
  const onDragStart=useCallback((e,uid)=>{
    e.preventDefault();e.stopPropagation();
    setDragInfo({uid,currentX:e.clientX,currentY:e.clientY,dropTarget:null});
    try{e.target.setPointerCapture(e.pointerId);}catch{}
  },[]);
  const onDragMove=useCallback((e)=>{
    setDragInfo(d=>{
      if(!d)return d;
      // Find drop target under pointer
      const el=document.elementFromPoint(e.clientX,e.clientY);
      const slot=el?el.closest('[data-ex-uid]'):null;
      let dropTarget=null;
      if(slot){
        const tgtUid=slot.getAttribute('data-ex-uid');
        if(tgtUid&&tgtUid!==d.uid){
          const r=slot.getBoundingClientRect();
          const position=e.clientY<r.top+r.height/2?'above':'below';
          dropTarget={uid:tgtUid,position};
        }
      }
      return{...d,currentX:e.clientX,currentY:e.clientY,dropTarget};
    });
  },[]);
  const onDragEnd=useCallback((e)=>{
    setDragInfo(d=>{
      if(d&&d.dropTarget){
        moveExerciseToTarget(d.uid,d.dropTarget.uid,d.dropTarget.position);
      }
      return null;
    });
  },[customSections]);// eslint-disable-line react-hooks/exhaustive-deps

  // Attach global move/up listeners while dragging
  useEffect(()=>{
    if(!dragInfo)return;
    window.addEventListener('pointermove',onDragMove,{passive:false});
    window.addEventListener('pointerup',onDragEnd);
    window.addEventListener('pointercancel',onDragEnd);
    return()=>{
      window.removeEventListener('pointermove',onDragMove);
      window.removeEventListener('pointerup',onDragEnd);
      window.removeEventListener('pointercancel',onDragEnd);
    };
  },[dragInfo,onDragMove,onDragEnd]);

  const finish=async()=>{
    const ig=isGymSession(atype);
    let data={workoutNotes:wnotes};
    if(ig&&customSections){
      // Read from customSections (the actual session structure) and gdata-by-uid
      data.sections=customSections.map(sec=>({
        title:sec.title,
        supersets:sec.supersets.map(ss=>({
          label:ss.label,
          exercises:ss.exercises.map(ex=>({name:ex.name,...(gdata[ex._uid]||{})}))
        }))
      }));
    }else{
      data={...cdata,workoutNotes:wnotes};
    }
    // Wave 3: record elapsed duration in minutes. Only if a start time exists and the elapsed
    // time is plausible (< 6h) — guards against a stale start from a backdated/very old draft.
    if(sessionStart){
      const mins=Math.round((Date.now()-sessionStart)/60000);
      if(mins>0&&mins<360)data.durationMin=mins;
    }
    const session={id:Date.now(),user_id:userId,type:atype,session_date:sessionDate?new Date(sessionDate+'T12:00:00').toISOString():new Date().toISOString(),week,data};
    setHist(h=>[session,...h]);setSaving(true);
    // Try upsert. If it fails, queue for retry on next load or banner-tap.
    try{
      await postSessionUpsert(session);
    }catch(e){
      console.error('Save failed — queued for retry:',e);
      addPending(session);
      setPendingCount(getPending().length);
    }
    await delDraft();setSaving(false);setDone2(session);setScreen('review');setAtype(null);
  };

  const plan=atype?PLAN[atype]:null;
  const col=plan?plan.color:A;
  const ig=isGymSession(atype);
  // dtw = types completed this week (used for "done" badge on session cards)
  // daysCompleted = day-of-week set (used for week strip — ticks any day with any session)
  const sessionsThisWeek=hist.filter(s=>s.week===week);
  const dtw=sessionsThisWeek.map(s=>s.type);
  const daysCompleted=useMemo(()=>{
    const set=new Set();
    for(const s of sessionsThisWeek){
      const d=new Date(s.session_date);
      // JS getDay: Sun=0..Sat=6. We want Mon=0..Sun=6 to match DAYS[]
      set.add(DAYS[(d.getDay()+6)%7]);
    }
    return set;
  },[sessionsThisWeek.map(s=>s.session_date).join(',')]);
  const rc=done2&&PLAN[done2.type]?PLAN[done2.type].color:A;
  const navScreen=screen==='review'?'home':screen==='log'?'live':screen;

  if(!loaded)return(
    <div style={{background:'#070E1A',minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:10}}>
      <div style={{display:'flex',gap:6}}>{[0,1,2].map(i=><div key={i} style={{width:8,height:8,borderRadius:'50%',background:A,animation:`pulse 1.2s ease-in-out ${i*0.2}s infinite`}}/>)}</div>
      <div style={{color:'#475569',fontSize:12}}>Loading Training Log...</div>
    </div>
  );

  return(
    <div style={{background:'#070E1A',minHeight:'100vh',color:'#E2E8F0',maxWidth:520,margin:'0 auto',paddingBottom:80}}>

      {/* HEADER */}
      <div style={{padding:'20px 20px 0',background:'linear-gradient(180deg,#0A1628 0%,transparent 100%)',position:'sticky',top:0,zIndex:50,backdropFilter:'blur(8px)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div onClick={()=>setShowSettings(true)} style={{cursor:'pointer'}}>
            <div style={{fontSize:21,fontWeight:700,letterSpacing:-0.5}}>Training Log <span style={{color:'#334155',fontSize:13,fontWeight:400}}>⚙</span></div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{color:'#475569',fontSize:10,marginBottom:3}}>WEEK</div>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <button onClick={()=>setWeek(w=>Math.max(1,w-1))} style={{background:'none',border:'1px solid #1E3A5F',borderRadius:4,color:'#475569',width:24,height:24,cursor:'pointer',fontSize:16}}>‹</button>
              <button onClick={()=>setShowDP(v=>!v)} style={{background:'none',border:'none',cursor:'pointer',padding:0,textAlign:'center'}}>
                <div style={{color:startDate?A:O,fontSize:22,fontFamily:'monospace',fontWeight:700,minWidth:28}}>{week}</div>
                <div style={{color:startDate?'#1E3A5F':O,fontSize:8,fontWeight:startDate?400:700}}>{startDate?'auto':'tap to set!'}</div>
              </button>
              <button onClick={()=>setWeek(w=>Math.min(12,w+1))} style={{background:'none',border:'1px solid #1E3A5F',borderRadius:4,color:'#475569',width:24,height:24,cursor:'pointer',fontSize:16}}>›</button>
            </div>
          </div>
        </div>
        {showDP&&(
          <div style={{background:'#0D1B2E',border:`1px solid ${A}33`,borderRadius:10,padding:'12px 14px',marginTop:10}}>
            <div style={{color:'#94A3B8',fontSize:12,marginBottom:8}}>Set plan start date — week auto-calculates</div>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <input type="date" value={startDate} onChange={e=>applyStart(e.target.value)} style={{flex:1,background:'#070E1A',border:'1px solid #1E3A5F',borderRadius:6,color:A,padding:'7px 10px',fontSize:13,outline:'none'}}/>
              <button onClick={()=>setShowDP(false)} style={{background:'none',border:'1px solid #1E3A5F',borderRadius:6,color:'#475569',padding:'7px 12px',cursor:'pointer',fontSize:12}}>Done</button>
            </div>
            {startDate&&<div style={{color:'#475569',fontSize:11,marginTop:6}}>Currently Week {calcWeek(startDate)} of 12</div>}
          </div>
        )}
        <div style={{display:'flex',marginTop:12,borderBottom:'1px solid #1E2D40',overflowX:'auto'}}>
          {/* Sessions tab — never kills live session */}
          <button onClick={()=>setScreen('home')} style={{flex:1,padding:'8px 0',background:'none',border:'none',color:navScreen==='home'?A:'#475569',fontSize:12,fontWeight:navScreen==='home'?600:400,cursor:'pointer',borderBottom:navScreen==='home'?`2px solid ${A}`:'2px solid transparent',textAlign:'center',whiteSpace:'nowrap'}}>Sessions</button>
          {/* LIVE tab — only visible when a session is active */}
          {atype&&(
            <button onClick={()=>setScreen('log')} style={{flex:1,padding:'8px 0',background:'none',border:'none',color:navScreen==='live'?O:'#FB923C88',fontSize:12,fontWeight:700,cursor:'pointer',borderBottom:navScreen==='live'?`2px solid ${O}`:'2px solid transparent',textAlign:'center',whiteSpace:'nowrap',position:'relative'}}>
              <span style={{marginRight:4}}>⬤</span>Live
              {saving&&<span style={{color:'#334155',fontSize:9,position:'absolute',bottom:0,left:'50%',transform:'translateX(-50%)'}}>saving</span>}
            </button>
          )}
          <button onClick={()=>setScreen('exercises')} style={{flex:1,padding:'8px 0',background:'none',border:'none',color:navScreen==='exercises'?A:'#475569',fontSize:12,fontWeight:navScreen==='exercises'?600:400,cursor:'pointer',borderBottom:navScreen==='exercises'?`2px solid ${A}`:'2px solid transparent',textAlign:'center',whiteSpace:'nowrap'}}>Exercises</button>
          <button onClick={()=>setScreen('history')} style={{flex:1,padding:'8px 0',background:'none',border:'none',color:navScreen==='history'?A:'#475569',fontSize:12,fontWeight:navScreen==='history'?600:400,cursor:'pointer',borderBottom:navScreen==='history'?`2px solid ${A}`:'2px solid transparent',textAlign:'center',whiteSpace:'nowrap'}}>History</button>
          <button onClick={()=>setScreen('claudept')} style={{flex:1,padding:'8px 0',background:'none',border:'none',color:navScreen==='claudept'?PU:'#475569',fontSize:12,fontWeight:navScreen==='claudept'?600:400,cursor:'pointer',borderBottom:navScreen==='claudept'?`2px solid ${PU}`:'2px solid transparent',textAlign:'center',whiteSpace:'nowrap'}}>Claude PT</button>
        </div>
        {/* B2: database unreachable banner — reassures that data is safe, offers manual retry */}
        {dbError&&(
          <div style={{marginTop:8,padding:'8px 12px',background:R+'1A',border:`1px solid ${R}55`,borderRadius:8,display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:14}}>🔌</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{color:R,fontSize:12,fontWeight:700}}>Can't reach the database</div>
              <div style={{color:'#94A3B8',fontSize:10}}>Your data is safe. This is usually a paused free-tier database — it wakes in a minute or two.</div>
            </div>
            <button onClick={retryDbConnection} style={{padding:'4px 10px',background:R+'22',border:`1px solid ${R}`,borderRadius:6,color:R,fontSize:11,fontWeight:600,cursor:'pointer'}}>Retry</button>
          </div>
        )}
        {/* Pending sync banner — only shown when sessions failed to save */}
        {pendingCount>0&&(
          <div style={{marginTop:8,padding:'8px 12px',background:O+'1A',border:`1px solid ${O}55`,borderRadius:8,display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:14}}>⚠️</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{color:O,fontSize:12,fontWeight:700}}>{pendingCount} session{pendingCount>1?'s':''} waiting to sync</div>
              <div style={{color:'#94A3B8',fontSize:10}}>Saved locally. Will retry automatically.</div>
            </div>
            <button onClick={retrySync} disabled={syncing} style={{padding:'4px 10px',background:syncing?'#1E2D40':O+'33',border:`1px solid ${O}`,borderRadius:6,color:syncing?'#475569':O,fontSize:11,fontWeight:600,cursor:syncing?'default':'pointer'}}>{syncing?'Syncing...':'Retry now'}</button>
          </div>
        )}
      </div>

      {/* HOME */}
      {screen==='home'&&(
        <div style={{padding:'16px 20px 0'}}>
          <div style={{marginBottom:16}}>
            <div style={{color:'#475569',fontSize:10,textTransform:'uppercase',letterSpacing:1.5,marginBottom:8}}>Week {week} Progress</div>
            <div style={{display:'flex',gap:5}}>
              {DAYS.map(day=>{const exp=activeDMAP[day],dn=daysCompleted.has(day),rest=exp==='Rest'&&!dn;const lbl=exp==='Rest'?'–':exp==='Walk'?'W':((PLAN[exp]&&PLAN[exp].icon)||exp.replace('Gym ',''));return(
                <div key={day} style={{flex:1,textAlign:'center'}}>
                  <div style={{fontSize:9,color:'#334155',marginBottom:3,fontFamily:'monospace'}}>{day}</div>
                  <div style={{height:30,borderRadius:6,background:rest?'#0D1B2E':dn?G+'33':'#0D1B2E',border:`1px solid ${rest?'#1E2D40':dn?G+'88':'#1E3A5F'}`,display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <span style={{fontSize:9,color:rest?'#1E3A5F':dn?G:'#334155',fontWeight:600}}>{rest?'–':dn?'✓':lbl}</span>
                  </div>
                </div>
              );})}
            </div>
          </div>
          <div style={{display:'flex',gap:6,marginBottom:16,background:'#0A1628',border:'1px solid #1E2D40',borderRadius:10,padding:4}}>
            <button onClick={()=>switchMode('home')} style={{flex:1,padding:'8px 0',background:planMode==='home'?A+'22':'transparent',border:`1px solid ${planMode==='home'?A+'88':'transparent'}`,borderRadius:8,color:planMode==='home'?A:'#475569',fontSize:10,fontWeight:700,cursor:'pointer'}}>🏠 Home</button>
            <button onClick={()=>switchMode('london')} style={{flex:1,padding:'8px 0',background:planMode==='london'?BK+'22':'transparent',border:`1px solid ${planMode==='london'?BK+'88':'transparent'}`,borderRadius:8,color:planMode==='london'?BK:'#475569',fontSize:10,fontWeight:700,cursor:'pointer'}}>🇬🇧 London</button>
            <button onClick={()=>switchMode('travel')} style={{flex:1,padding:'8px 0',background:planMode==='travel'?PU+'22':'transparent',border:`1px solid ${planMode==='travel'?PU+'88':'transparent'}`,borderRadius:8,color:planMode==='travel'?PU:'#475569',fontSize:10,fontWeight:700,cursor:'pointer'}}>✈️ Travel</button>
            <button onClick={()=>switchMode('italy')} style={{flex:1,padding:'8px 0',background:planMode==='italy'?G+'22':'transparent',border:`1px solid ${planMode==='italy'?G+'88':'transparent'}`,borderRadius:8,color:planMode==='italy'?G:'#475569',fontSize:10,fontWeight:700,cursor:'pointer'}}>🇮🇹 Italy</button>
          </div>
          <div style={{color:'#475569',fontSize:10,textTransform:'uppercase',letterSpacing:1.5,marginBottom:10}}>Start Session</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:16}}>
            {Object.entries(PLAN).filter(([name,p])=>showInMode(p)&&!isArchived(name)).map(([name,p])=>{const dn=dtw.includes(name);const isLive=atype===name;return(
              <button key={name} onClick={()=>startSess(name)} style={{padding:'14px 12px',background:isLive?O+'18':'#0A1628',border:`1px solid ${isLive?O:(dn?p.color+'88':p.color+'44')}`,borderRadius:12,cursor:'pointer',textAlign:'left',position:'relative',overflow:'hidden'}}>
                {isLive&&<div style={{position:'absolute',top:7,right:8,background:O,color:'#0A1628',fontSize:8,fontWeight:800,padding:'2px 6px',borderRadius:4,letterSpacing:0.5}}>● LIVE</div>}
                {dn&&!isLive&&<div style={{position:'absolute',top:8,right:8,width:7,height:7,background:G,borderRadius:'50%'}}/>}
                <div style={{fontSize:20,fontFamily:'monospace',fontWeight:900,color:isLive?O:p.color,marginBottom:3,lineHeight:1}}>{p.icon}</div>
                <div style={{color:'#E2E8F0',fontSize:13,fontWeight:600}}>{name}</div>
                <div style={{color:isLive?O:'#334155',fontSize:10,marginTop:2}}>{isLive?'Tap to resume →':p.subtitle.split(' ').slice(0,3).join(' ')+'...'}</div>
              </button>
            );})}
          </div>
          {(()=>{const arch=Object.entries(PLAN).filter(([name,p])=>showInMode(p)&&isArchived(name));
            if(!arch.length)return null;
            return(
              <div style={{marginTop:10}}>
                <button onClick={()=>setShowArchived(s=>!s)} style={{width:'100%',padding:'8px 12px',background:'transparent',border:'1px dashed #1E3A5F',borderRadius:8,color:'#475569',fontSize:11,fontWeight:600,cursor:'pointer',textAlign:'left'}}>
                  {showArchived?'▾':'▸'} Inactive ({arch.length})
                </button>
                {showArchived&&(
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:8}}>
                    {arch.map(([name,p])=>(
                      <button key={name} onClick={()=>startSess(name)} style={{padding:'14px 12px',background:'#070E1A',border:'1px solid #1E2D40',borderRadius:12,cursor:'pointer',textAlign:'left',opacity:0.6}}>
                        <div style={{fontSize:20,fontFamily:'monospace',fontWeight:900,color:'#475569',marginBottom:3,lineHeight:1}}>{p.icon}</div>
                        <div style={{color:'#94A3B8',fontSize:13,fontWeight:600}}>{name}</div>
                        <div style={{color:'#334155',fontSize:10,marginTop:2}}>Inactive</div>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            );})()}
          {hist.length>0&&(
            <div>
              <div style={{color:'#475569',fontSize:10,textTransform:'uppercase',letterSpacing:1.5,marginBottom:8}}>Recent</div>
              {hist.slice(0,4).map(s=>{const p=PLAN[s.type];return(
                <div key={s.id} onClick={()=>setView(s)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:'#0D1B2E',border:'1px solid #1E2D40',borderRadius:10,marginBottom:7,cursor:'pointer'}}>
                  <div style={{width:34,height:34,borderRadius:7,background:p?p.color+'22':'#1E2D40',border:`1px solid ${p?p.color+'44':'#1E2D40'}`,display:'flex',alignItems:'center',justifyContent:'center',color:p?p.color:A,fontSize:15,fontFamily:'monospace',fontWeight:900,flexShrink:0}}>{p?p.icon:'?'}</div>
                  <div style={{flex:1,minWidth:0}}><div style={{color:'#CBD5E1',fontSize:13,fontWeight:600}}>{s.type}</div><div style={{color:'#334155',fontSize:11}}>{fmt(s.session_date)} · Wk {s.week}</div></div>
                  <div style={{color:'#1E3A5F'}}>›</div>
                </div>
              );})}
            </div>
          )}
        </div>
      )}

      {screen==='exercises'&&<ExerciseLibrary hist={hist}/>}

      {/* LOG */}
      {screen==='log'&&atype&&(
        <div style={{padding:'14px 20px 0'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <div><div style={{color:col,fontSize:18,fontWeight:700}}>{atype}</div><div style={{color:'#475569',fontSize:11}}>{plan?plan.subtitle:''}</div></div>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <LiveElapsed startMs={sessionStart} color={col}/>
              <button onClick={()=>{if(confirm('Cancel this session? Nothing logged will be saved.')){delDraft();setScreen('home');setAtype(null);setCustomSections(null);}}} style={{background:'none',border:'1px solid #1E3A5F',borderRadius:6,color:'#475569',padding:'4px 10px',cursor:'pointer',fontSize:12}}>Cancel</button>
            </div>
          </div>
          {/* Session date picker — defaults to today, can backdate */}
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,padding:'8px 12px',background:'#0A1628',border:'1px solid #1E3A5F',borderRadius:8}}>
            <span style={{color:'#475569',fontSize:11,flexShrink:0}}>📅 Date</span>
            <input type="date" value={sessionDate} onChange={e=>setSessionDate(e.target.value)}
              style={{flex:1,background:'transparent',border:'none',color:col,fontSize:13,fontFamily:'monospace',fontWeight:600,outline:'none'}}/>
            {sessionDate!==new Date().toISOString().slice(0,10)&&(
              <span style={{color:O,fontSize:10,fontWeight:600,flexShrink:0}}>backdated</span>
            )}
          </div>
          {ig&&(
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,padding:'8px 12px',background:'#0A1628',border:'1px solid #1E3A5F',borderRadius:8}}>
              <span style={{color:'#475569',fontSize:12,flexShrink:0}}>⏱ Rest</span>
              <div style={{display:'flex',gap:5,flex:1,flexWrap:'wrap'}}>
                {ROPT.map(o=><button key={o.v} onClick={()=>setRestDur(o.v)} style={{padding:'3px 9px',borderRadius:5,border:`1px solid ${restDur===o.v?A:'#1E3A5F'}`,background:restDur===o.v?A+'22':'transparent',color:restDur===o.v?A:'#475569',cursor:'pointer',fontSize:11,fontWeight:restDur===o.v?700:400}}>{o.l}</button>)}
              </div>
            </div>
          )}
          {ig&&(customSections||PLAN[atype].sections).map((sec,si)=><SecBlock key={si} sec={sec} si={si} gdata={gdata} restDur={restDur} hist={hist} onChange={hgc} onDragStart={onDragStart} dragInfo={dragInfo} onAddExercise={(secIdx)=>setAddPickerCtx({secIdx,ssIdx:null})} onRemoveEx={removeExerciseByUid}/>)}
          {atype==='Bike'&&<BikeLogger data={cdata} onChange={setCdata} week={week}/>}
          {atype==='Walk'&&<WalkLogger data={cdata} onChange={setCdata}/>}
          {atype==='Swim'&&<SwimLogger data={cdata} onChange={setCdata} sphase={sphase} setSphase={setSphase}/>}
          {atype==='Run'&&<RunLogger data={cdata} onChange={setCdata} week={week}/>}
          <div style={{background:'#0A1628',border:'1px solid #1E3A5F',borderRadius:10,padding:'12px 14px',marginTop:4,marginBottom:14}}>
            <div style={{color:'#475569',fontSize:11,textTransform:'uppercase',letterSpacing:1,marginBottom:6}}>Workout Notes</div>
            <textarea placeholder="How did the session feel overall?" value={wnotes} onChange={e=>setWnotes(e.target.value)} style={{width:'100%',background:'transparent',border:'none',color:'#CBD5E1',fontSize:13,outline:'none',resize:'vertical',minHeight:70,boxSizing:'border-box',lineHeight:1.5}}/>
          </div>
          <button onClick={finish} disabled={saving} style={{width:'100%',marginBottom:16,padding:'14px',background:saving?'#1E2D40':`linear-gradient(135deg,${col}44,${col}22)`,border:`1px solid ${saving?'#334155':col+'88'}`,borderRadius:10,color:saving?'#475569':col,fontSize:14,fontWeight:700,cursor:saving?'default':'pointer'}}>{saving?'Saving...':'Complete Session ✓'}</button>
        </div>
      )}

      {/* REVIEW */}
      {screen==='review'&&done2&&(
        <div style={{padding:'14px 20px 0'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
            <div><div style={{color:rc,fontSize:18,fontWeight:700}}>{done2.type} — Done ✓</div><div style={{color:'#475569',fontSize:11}}>{fmt(done2.session_date)} · Week {done2.week}{done2.data&&fmtDur(done2.data.durationMin)?` · ${fmtDur(done2.data.durationMin)}`:''}</div></div>
            <button onClick={()=>setScreen('home')} style={{background:'none',border:'1px solid #1E3A5F',borderRadius:6,color:'#475569',padding:'4px 10px',cursor:'pointer',fontSize:12}}>Home</button>
          </div>
          {done2.data&&done2.data.workoutNotes&&<div style={{background:'#0D1B2E',border:'1px solid #1E3A5F',borderRadius:8,padding:'10px 12px',marginBottom:12}}><div style={{color:'#475569',fontSize:10,textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>Your Notes</div><div style={{color:'#CBD5E1',fontSize:13}}>{done2.data.workoutNotes}</div></div>}
          <RevPanel session={done2} hist={hist} color={rc} onFeedback={addPtFeedback}/>
        </div>
      )}

      {/* HISTORY */}
      {screen==='history'&&(
        <div style={{padding:'16px 20px 0'}}>
          <div style={{color:'#475569',fontSize:10,textTransform:'uppercase',letterSpacing:1.5,marginBottom:10}}>All Sessions ({hist.length})</div>
          {hist.length===0&&<div style={{textAlign:'center',padding:'60px 0',color:'#1E3A5F'}}><div style={{fontSize:28,marginBottom:8}}>○</div><div style={{fontSize:13}}>No sessions yet</div></div>}
          {hist.length>0&&(()=>{
            // Type filter chips — built from the session types actually present in history
            const types=Array.from(new Set(hist.map(s=>s.type)));
            const filtered=histFilter==='All'?hist:hist.filter(s=>s.type===histFilter);
            // Group filtered sessions by "Month Year" (hist is already sorted desc by date)
            const groups=[];const seen={};
            for(const s of filtered){
              const d=new Date(s.session_date);
              const key=d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
              if(!seen[key]){seen[key]={key,items:[]};groups.push(seen[key]);}
              seen[key].items.push(s);
            }
            return(
              <>
                <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:14}}>
                  {['All',...types].map(t=>{const p=PLAN[t];const on=histFilter===t;const cc=t==='All'?A:(p?p.color:A);return(
                    <button key={t} onClick={()=>setHistFilter(t)} style={{padding:'5px 10px',borderRadius:14,border:`1px solid ${on?cc:'#1E2D40'}`,background:on?cc+'22':'transparent',color:on?cc:'#475569',cursor:'pointer',fontSize:11,fontWeight:on?700:400}}>{t}</button>
                  );})}
                </div>
                {groups.map(g=>(
                  <div key={g.key} style={{marginBottom:16}}>
                    <div style={{color:'#334155',fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:1,marginBottom:8}}>{g.key} · {g.items.length}</div>
                    {g.items.map(s=>{const p=PLAN[s.type];const dur=s.data&&fmtDur(s.data.durationMin);return(
                      <div key={s.id} onClick={()=>setView(s)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:'#0D1B2E',border:'1px solid #1E2D40',borderRadius:10,marginBottom:7,cursor:'pointer'}}>
                        <div style={{width:34,height:34,borderRadius:7,background:p?p.color+'22':'#1E2D40',border:`1px solid ${p?p.color+'44':'#1E2D40'}`,display:'flex',alignItems:'center',justifyContent:'center',color:p?p.color:A,fontSize:15,fontFamily:'monospace',fontWeight:900,flexShrink:0}}>{p?p.icon:'?'}</div>
                        <div style={{flex:1}}><div style={{color:'#CBD5E1',fontSize:13,fontWeight:600}}>{s.type}</div><div style={{color:'#334155',fontSize:11}}>{fmt(s.session_date)} · Wk {s.week}{dur?` · ${dur}`:''}</div></div>
                        <div style={{color:'#1E3A5F'}}>›</div>
                      </div>
                    );})}
                  </div>
                ))}
              </>
            );
          })()}
        </div>
      )}

      {/* CLAUDE PT */}
      {screen==='claudept'&&(
        <ClaudePT messages={ptMessages} setMessages={setPtMessages}/>
      )}

      {/* SESSION DETAIL MODAL */}
      {view&&(
        <div style={{position:'fixed',inset:0,background:'#000000bb',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:16}} onClick={()=>setView(null)}>
          <div style={{background:'#0A1628',border:`1px solid ${PLAN[view.type]?PLAN[view.type].color:'#334155'}44`,borderRadius:14,padding:20,maxWidth:460,width:'100%',maxHeight:'88vh',overflowY:'auto'}} onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
              <div><div style={{color:PLAN[view.type]?PLAN[view.type].color:A,fontSize:17,fontWeight:700}}>{view.type}</div><div style={{color:'#475569',fontSize:12}}>{fmt(view.session_date)} — Week {view.week}{view.data&&fmtDur(view.data.durationMin)?` · ${fmtDur(view.data.durationMin)}`:''}</div></div>
              <button onClick={()=>setView(null)} style={{background:'none',border:'none',color:'#475569',fontSize:22,cursor:'pointer'}}>×</button>
            </div>
            {view.data&&view.data.workoutNotes&&<div style={{background:'#0D1B2E',border:'1px solid #1E3A5F',borderRadius:8,padding:'10px 12px',marginBottom:12}}><div style={{color:'#475569',fontSize:10,textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>Workout Notes</div><div style={{color:'#CBD5E1',fontSize:13}}>{view.data.workoutNotes}</div></div>}
            {isGymSession(view.type)&&view.data&&view.data.sections&&view.data.sections.map((sec,si)=>(
              <div key={si} style={{marginBottom:12}}>
                <div style={{color:'#94A3B8',fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:1,marginBottom:6,paddingBottom:4,borderBottom:'1px solid #1E2D40'}}>{sec.title}</div>
                {(sec.supersets||[]).map((ss,ssi)=>(
                  <div key={ssi} style={{marginBottom:10}}>
                    <div style={{color:'#475569',fontSize:10,marginBottom:5}}>{ss.label}</div>
                    {(ss.exercises||[]).map((ex,ei)=>{
                      const sets=ex.sets||[];if(!sets.some(s=>s.weight||s.reps))return null;
                      const vc=PLAN[view.type]?PLAN[view.type].color:A;
                      return <div key={ei} style={{marginBottom:6,padding:'8px 10px',background:'#0D1B2E',borderRadius:7}}><div style={{color:'#CBD5E1',fontSize:12,fontWeight:600,marginBottom:4}}>{ex.name}</div>{sets.map((s,si2)=>(s.weight||s.reps)&&<div key={si2} style={{display:'flex',gap:8,fontSize:11,fontFamily:'monospace',color:'#475569',marginBottom:1}}><span>Set {si2+1}:</span><span style={{color:vc}}>{s.weight||'–'}kg</span><span>×</span><span style={{color:'#94A3B8'}}>{s.reps||'–'} reps</span>{s.done&&<span style={{color:G}}>✓</span>}</div>)}{ex.rpe&&<div style={{marginTop:4,fontSize:11,color:'#475569'}}>RPE {ex.rpe}</div>}</div>;
                    })}
                  </div>
                ))}
              </div>
            ))}
            {!isGymSession(view.type)&&view.data&&(
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
                {Object.entries(view.data).filter(([k])=>k!=='notes'&&k!=='workoutNotes'&&view.data[k]).map(([k,v])=>{const vc=PLAN[view.type]?PLAN[view.type].color:A;return <div key={k} style={{background:'#0D1B2E',borderRadius:8,padding:'8px 10px'}}><div style={{color:'#475569',fontSize:10,textTransform:'capitalize'}}>{k.replace(/([A-Z])/g,' $1')}</div><div style={{color:vc,fontSize:14,fontFamily:'monospace',fontWeight:700}}>{v}</div></div>;})}
              </div>
            )}
            <RevPanel session={view} hist={hist} color={PLAN[view.type]?PLAN[view.type].color:A} onFeedback={addPtFeedback}/>
          </div>
        </div>
      )}
      {showHealthReminder&&<HealthReminderModal onClose={()=>setShowHealthReminder(false)} onDisable={()=>{localStorage.setItem('tl-health-reminder-disabled','1');setHealthReminderOff(true);setShowHealthReminder(false);}}/>}
      {addPickerCtx&&customSections&&<AddExercisePicker ctx={addPickerCtx} customSections={customSections} onPick={addExerciseToSession} onClose={()=>setAddPickerCtx(null)}/>}
      {showSettings&&<SettingsScreen onClose={()=>setShowSettings(false)} restDur={restDur} setRestDur={setRestDur} healthReminderOff={healthReminderOff} setHealthReminderOff={setHealthReminderOff} bwLog={bwLog} addBwEntry={addBwEntry} hist={hist} exportCsv={exportCsv} archived={archived} toggleArchived={toggleArchived} planMode={planMode}/>}
      <DragGhost info={dragInfo}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
// Registers the app-shell service worker for offline/flaky-connection resilience.
// Only affects install/boot behaviour — never touches Supabase, RapidAPI, or Claude proxy calls.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => console.error('SW registration failed:', err));
  });
}
</script>
</body>
</html>
