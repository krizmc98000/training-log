// ── EXERCISE IMAGE (free-exercise-db, public domain static CDN) ────────────────
// No API key, no rate limits — images are plain files on GitHub's CDN. We map each
// exercise to a verified image id and build the URL directly. Unmapped exercises
// (stretches, mobility, bespoke moves) return null and the UI shows coaching tips instead.
const FREEDB_BASE='https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';
function getExerciseImages(exName){
  const id=FREEDB_IMG[exName];
  if(!id)return null;
  // Each exercise has two stills: /0.jpg (start) and /1.jpg (end) — we use both for a
  // simple start/finish reference that auto-alternates in the UI.
  return [FREEDB_BASE+id+'/0.jpg',FREEDB_BASE+id+'/1.jpg'];
}

async function db(method,path,body){
  const res=await fetch(SB+'/rest/v1'+path,{method,headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':'return=minimal'},body:body?JSON.stringify(body):undefined});
  if(!res.ok)throw new Error('DB '+res.status);
  const t=await res.text();return t?JSON.parse(t):null;
}

// ── SAVE-RETRY QUEUE ──────────────────────────────────────────────────────────
// Sessions that fail to POST get queued in localStorage. Retried on every page load
// and on demand via the banner. Uses upsert so a re-POST of an already-synced session is a no-op.
const PENDING_KEY='tl-pending-sessions';
function getPending(){try{return JSON.parse(localStorage.getItem(PENDING_KEY)||'[]');}catch{return[];}}
function setPending(arr){try{localStorage.setItem(PENDING_KEY,JSON.stringify(arr));}catch{}}
function addPending(session){const p=getPending();if(!p.some(s=>s.id===session.id))p.push(session);setPending(p);}
async function postSessionUpsert(session){
  // on_conflict=id with merge-duplicates means re-syncing an already-saved session is harmless
  const res=await fetch(SB+'/rest/v1/sessions?on_conflict=id',{
    method:'POST',
    headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify(session)
  });
  if(!res.ok)throw new Error('POST '+res.status);
}
async function syncPendingQueue(){
  const pending=getPending();
  if(!pending.length)return{synced:0,remaining:0};
  const remaining=[];let synced=0;
  for(const s of pending){
    try{await postSessionUpsert(s);synced++;}
    catch{remaining.push(s);}
  }
  setPending(remaining);
  return{synced,remaining:remaining.length};
}

// ── CLAUDE PT CHAT BACKUP ─────────────────────────────────────────────────────
// The chat used to live only in localStorage, which iOS wipes on PWA reinstall (the same
// event that cleared the user id and week). We now back the whole conversation up to Supabase
// as a single row keyed by user_id — reinstall-proof, like the session history.
async function saveChatBackup(userId,messages){
  // Store only the trailing 200 messages to keep the row small
  const trimmed=messages.slice(-200);
  const res=await fetch(SB+'/rest/v1/pt_chat?on_conflict=user_id',{
    method:'POST',
    headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify({user_id:userId,messages:trimmed,updated_at:new Date().toISOString()})
  });
  if(!res.ok)throw new Error('chat backup '+res.status);
}
async function loadChatBackup(userId){
  const rows=await db('GET',`/pt_chat?user_id=eq.${userId}&select=messages`);
  return rows&&rows.length?(rows[0].messages||[]):null;
}

// This is a single-user personal app — always use the same fixed ID rather than generating a
// random one per install. A random ID meant deleting/re-adding the home screen icon (which wipes
// iOS's isolated PWA storage) silently pointed the app at a brand new empty "user", making real
// history look lost. Pinning it here means any future reinstall, browser, or device reconnects
// to the same data automatically — no manual recovery step needed.
function uid(){
  const FIXED_ID='chris-yqp5rrpt';
  try{if(localStorage.getItem('tl-uid')!==FIXED_ID)localStorage.setItem('tl-uid',FIXED_ID);}catch{}
  return FIXED_ID;
}
const fmt=iso=>new Date(iso).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
function calcWeek(sd){if(!sd)return 1;const diff=new Date()-new Date(sd);return Math.max(1,Math.min(12,Math.floor(diff/(1000*60*60*24*7))+1));}
// Find last logged sets for a named exercise across ALL sessions (any type). Optionally exclude a session id.
function getPrevExSets(hist,exName,excludeId){
  for(const session of hist){
    if(excludeId&&session.id===excludeId)continue;
    if(!session.data||!session.data.sections)continue;
    for(const sec of session.data.sections){
      for(const ss of sec.supersets||[]){
        for(const ex of ss.exercises||[]){
          if(ex.name===exName){
            const ds=(ex.sets||[]).filter(s=>s.weight||s.reps);
            if(ds.length)return ds;
          }
        }
      }
    }
  }
  return null;
}
// True if this exercise hit top rep range on all sets across its 2 most recent occurrences (any session type).
function canProgressByExercise(hist,exName,repsStr){
  const top=parseInt((repsStr||'').split('-').pop());
  if(isNaN(top))return false;
  const occurrences=[];
  outer:for(const session of hist){
    if(!session.data||!session.data.sections)continue;
    for(const sec of session.data.sections){
      for(const ss of sec.supersets||[]){
        for(const ex of ss.exercises||[]){
          if(ex.name===exName){
            const sets=(ex.sets||[]).filter(s=>s.weight||s.reps);
            if(sets.length){occurrences.push(sets);if(occurrences.length>=2)break outer;}
          }
        }
      }
    }
  }
  if(occurrences.length<2)return false;
  return occurrences.every(sets=>sets.length>0&&sets.every(s=>s.done&&parseInt(s.reps)>=top));
}
function getPersonalBest(hist,exName){
  let best=null,bestDate=null;
  for(const session of hist){if(!session.data||!session.data.sections)continue;for(const sec of session.data.sections){for(const ss of sec.supersets||[]){for(const ex of ss.exercises||[]){if(ex.name===exName){for(const s of ex.sets||[]){const w=parseFloat(s.weight),r=parseInt(s.reps);if(w&&r&&s.done){if(!best||w>best.weight||(w===best.weight&&r>best.reps)){best={weight:w,reps:r};bestDate=session.session_date;}}}}}}}}
  return best?{...best,date:bestDate}:null;
}
function getLastLogged(hist,exName){
  for(const session of hist){if(!session.data||!session.data.sections)continue;for(const sec of session.data.sections){for(const ss of sec.supersets||[]){for(const ex of ss.exercises||[]){if(ex.name===exName){const ds=(ex.sets||[]).filter(s=>s.weight&&s.reps&&s.done);if(ds.length)return{date:session.session_date,sets:ds,sessionType:session.type,week:session.week};}}}}}
  return null;
}
// Build a chronological time-series for one exercise: per session, the top-set weight, the
// estimated 1RM (Epley: w*(1+reps/30)), and total volume (sum of weight*reps over done sets).
function getExerciseSeries(hist,exName){
  const points=[];
  // hist is newest-first; reverse to plot oldest→newest
  for(const session of [...hist].reverse()){
    if(!session.data||!session.data.sections)continue;
    let topWeight=0,topReps=0,volume=0,found=false,best1rm=0;
    for(const sec of session.data.sections){
      for(const ss of sec.supersets||[]){
        for(const ex of ss.exercises||[]){
          if(ex.name!==exName)continue;
          for(const s of ex.sets||[]){
            const w=parseFloat(s.weight),r=parseInt(s.reps);
            if(w&&r&&s.done){
              found=true;volume+=w*r;
              const oneRm=w*(1+r/30);
              if(oneRm>best1rm){best1rm=oneRm;}
              if(w>topWeight||(w===topWeight&&r>topReps)){topWeight=w;topReps=r;}
            }
          }
        }
      }
    }
    if(found)points.push({date:session.session_date,topWeight,topReps,volume,est1rm:Math.round(best1rm*10)/10});
  }
  return points;
}
// Aggregate total sets per muscle group across the last N days (default 7).
// Uses the COACHING muscle field, taking the first token before any "/" as the primary group.
function getVolumeByMuscle(hist,days){
  const cutoff=Date.now()-(days||7)*86400000;
  const tally={};
  for(const session of hist){
    if(new Date(session.session_date).getTime()<cutoff)continue;
    if(!session.data||!session.data.sections)continue;
    for(const sec of session.data.sections){
      if(sec.title==='Warm-Up'||sec.title==='Post-Session Stretch'||sec.title==='Hip Flexor Lengthening')continue;
      for(const ss of sec.supersets||[]){
        for(const ex of ss.exercises||[]){
          const doneSets=(ex.sets||[]).filter(s=>s.done&&s.weight&&s.reps).length;
          if(!doneSets)continue;
          const entry=COACHING[ex.name]||WARMUP_COACHING[ex.name];
          const muscleRaw=entry?entry.muscle:'Other';
          const primary=(muscleRaw||'Other').split('/')[0].trim();
          tally[primary]=(tally[primary]||0)+doneSets;
        }
      }
    }
  }
  return Object.entries(tally).sort((a,b)=>b[1]-a[1]);
}
// Minimal dependency-free SVG line chart for a single numeric series
function MiniChart({points,accessor,color,label,unit}){
  if(!points||points.length<2)return null;
  const vals=points.map(accessor);
  const min=Math.min(...vals),max=Math.max(...vals);
  const range=max-min||1;
  const W=280,H=90,padX=6,padY=10;
  const stepX=(W-padX*2)/(points.length-1);
  const coords=points.map((p,i)=>{
    const x=padX+i*stepX;
    const y=padY+(H-padY*2)*(1-(accessor(p)-min)/range);
    return[x,y];
  });
  const path=coords.map((c,i)=>`${i===0?'M':'L'}${c[0].toFixed(1)},${c[1].toFixed(1)}`).join(' ');
  const first=vals[0],lastV=vals[vals.length-1];
  const delta=lastV-first;
  const deltaPct=first?Math.round((delta/first)*100):0;
  return(
    <div style={{background:'#0D1B2E',borderRadius:8,padding:'10px 12px',marginBottom:10}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:6}}>
        <span style={{color:'#475569',fontSize:10,textTransform:'uppercase',letterSpacing:1}}>{label}</span>
        <span style={{color:delta>=0?G:R,fontSize:11,fontFamily:'monospace',fontWeight:700}}>{delta>=0?'+':''}{Math.round(delta*10)/10}{unit} ({delta>=0?'+':''}{deltaPct}%)</span>
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{display:'block'}}>
        <path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        {coords.map((c,i)=><circle key={i} cx={c[0]} cy={c[1]} r="2.5" fill={color}/>)}
      </svg>
      <div style={{display:'flex',justifyContent:'space-between',marginTop:4}}>
        <span style={{color:'#334155',fontSize:9,fontFamily:'monospace'}}>{fmt(points[0].date)}</span>
        <span style={{color:'#334155',fontSize:9,fontFamily:'monospace'}}>{fmt(points[points.length-1].date)}</span>
      </div>
    </div>
  );
}

// ── COACHING DATA ─────────────────────────────────────────────────────────────
const COACHING={
  'Romanian Deadlift':{muscle:'Hamstring / Glute / Lower Back',category:'Hinge',tips:['Feet hip-width, bar at arms length. Push your hips back toward the wall behind you — this is a hinge, not a squat.','Keep the bar close to your body throughout. It should almost drag along your legs on the way up.','Maintain a neutral spine: chest up, slight arch in the lower back. Never let it round under load.','Feel a strong hamstring stretch at the bottom. Go as low as mobility allows without losing back position.','Squeeze your glutes hard at the top. Drive through the floor. Do not hyperextend.','Brace your core like you are about to take a punch before every rep — this protects the spine under load.']},
  'Bent-Over DB / Kettlebell Row':{muscle:'Back / Bicep / Rear Delt',category:'Pull',tips:['Hinge to roughly 45 degrees — torso close to parallel gives the best lat and mid-back activation.','Pull the weight toward your hip, not your shoulder. Hip = lats. Shoulder = traps.','Lead with your elbow, not your hand. Think of your hand as a hook — the elbow does the work.','Squeeze the shoulder blade toward your spine at the top of each rep. Hold for a full second.','Lower slowly — 2 to 3 seconds down. The controlled eccentric is where most hypertrophy happens.','Keep your core braced. Your trunk should remain completely still — no twisting or heaving.']},
  'Leg Press':{muscle:'Quad / Glute / Hamstring',category:'Quad',tips:['Feet shoulder-width at the middle of the platform. Too high = more glute; too low = more knee stress.','Lower until knees are at 90 degrees or past — do not let hips tuck or lower back lift off the pad.','Drive through your full foot, not just the heel. Heel-only pressing disengages the quad.','Keep a slight bend at the top — do not fully lock out. This keeps tension on the muscle.','Take 2 to 3 seconds to lower the weight. The eccentric builds more muscle than the concentric.']},
  'Flat DB Press (neutral grip)':{muscle:'Chest / Tricep / Front Delt',category:'Push',tips:['Neutral grip (palms facing each other) keeps elbows at 45 degrees — significantly reducing rotator cuff strain.','Lower with full control to your chest. Feel the stretch across the pec at the bottom.','Press up and slightly inward — dumbbells converge at the top to increase chest contraction.','Think about trying to crush the dumbbells together throughout the set. This increases chest fibre recruitment.','Drive your shoulder blades into the bench. Do not let the shoulders roll forward.']},
  'DB Split Squat (front foot elevated)':{muscle:'Quad / Glute / Hip Flexor',category:'Squat',tips:['Elevate the front foot on a step or plate — increases range of motion and quad emphasis.','Split stance wide enough that your knee tracks over your toes without going far past them.','Keep the torso upright. Leaning forward shifts the load to the glute — both valid, be intentional.','The back knee drops straight down toward the floor. Do not let it flare outward.','Drive through the front heel to stand. Feel the quad working through the full range.','Take 2 to 3 seconds on the way down. Complete all reps on one leg before switching.']},
  'Prone Dumbbell Leg Curl':{muscle:'Hamstring',category:'Hamstring',tips:['Lie face down on a flat bench. Hold a dumbbell vertically between your feet — grip it firmly with both feet crossed at the ankle.','The dumbbell should feel secure before you start. Take a moment to settle it — rushing this causes it to drop.','Curl both legs up toward your glutes in a controlled arc. Aim for full hamstring contraction at the top.','The 3-second eccentric lowering is critical. This controlled stretch under load is the primary hypertrophy driver for the hamstring.','Keep your hips pressed firmly into the bench throughout. Do not let them lift off as you curl.','No swinging or momentum. If the dumbbell is too heavy to control cleanly, drop the weight — form matters more than load here.','This is a direct replacement for the lying leg curl machine. The movement pattern is identical — only the load delivery differs.']},
  'Pallof Press':{muscle:'Core / Oblique',category:'Core',tips:['Cable at chest height. Stand sideways to the machine, feet shoulder-width, slight knee bend.','This is an anti-rotation exercise — resist the cable pulling you sideways, do not create movement.','Press the handle directly out and hold for 2 seconds. Feel the obliques working to prevent rotation.','Return slowly to the chest. Do not let the cable yank you back — control the return.','Further from the cable = more rotational force. Progress distance before adding weight.','Hips square, feet rooted. No leaning or shifting. The benefit comes entirely from the stillness.']},
  'Dead Bug':{muscle:'Deep Core / TVA',category:'Core',tips:['Lie on your back, lower back pressed firmly into the floor. This contact must be maintained throughout.','Arms toward the ceiling, knees bent at 90 degrees, shins parallel to the floor.','Breathe out fully before moving — this activates the deep transverse abdominis.','Slowly lower the opposite arm and leg simultaneously. Only go as far as you can keep the lower back flat.','Return to start. Breathe in, breathe out again before the next rep.','If your lower back arches away from the floor, you have gone too far.']},
  'Kettlebell Drag-Through':{muscle:'Deep Core / Anti-Rotation / Shoulders',category:'Core',tips:['Set up in a high plank on hands and toes (or drop to knees to regress), hands under shoulders, kettlebell just outside one wrist.','Brace the core hard and squeeze the glutes — the whole point is keeping the hips and shoulders SQUARE to the floor.','Reach the opposite hand across and under your torso, grab the kettlebell, and drag it across to the other side.','Place it down outside the other wrist, then re-plant that hand. Repeat, dragging it back the other way.','The core challenge is ANTI-ROTATION: resist the urge to let your hips or shoulders twist as the weight moves.','Move slowly and deliberately. If your hips are rocking side to side, the weight is too heavy — drop it.','Keep the neck neutral and breathe steadily throughout. Count each drag as one rep.']},
  'Kettlebell Around-the-World':{muscle:'Core / Grip / Shoulders',category:'Core',tips:['Stand tall, feet shoulder-width, a kettlebell held in front of you with one hand. Brace the core and keep the torso upright.','Pass the kettlebell around your body at waist/hip level — behind your back to the other hand, then around the front, in a continuous circle.','The hand-off happens smoothly behind you and in front of you. Keep the bell close to your body throughout.','Resist leaning or twisting — the core works to keep you stable while the weight orbits around you.','Do a set number of circles in one direction, then reverse.','Keep the shoulders down and relaxed, not shrugged up. Steady rhythm, no jerking.','Great grip and rotational-stability builder. Start light and controlled.']},
  'Single-Leg Glute Bridge (foot elevated)':{muscle:'Glute Max / Hamstring',category:'Foot Recovery',tips:['ANKLE-SAFE: the injured foot stays ELEVATED and unweighted throughout — no load goes through it.','Lie on your back. Place the WORKING leg heel up on the bench (or a raised surface). The injured leg is lifted and held off the floor.','Drive through the heel of the working leg on the bench to lift the hips, squeezing that glute hard at the top.','2-second hold at the top, then lower with control. All the drive comes from the elevated working heel — never the injured foot.','Keep the hips level — do not let the non-working side drop.','This trains glute and hamstring with zero weight-bearing through the injured foot/Achilles.','Add a dumbbell across the hips once bodyweight is easy. Do all reps one side, then switch the working leg.']},
  'Side-Lying Hip Adduction':{muscle:'Adductor (Inner Thigh)',category:'Foot Recovery',tips:['ANKLE-SAFE: fully unloaded, lying on your side — no foot contact with the ground.','Lie on your side. Bend the TOP leg and plant its foot on the floor in front of the bottom thigh for support.','Keep the BOTTOM leg straight and lift it up toward the ceiling, leading with the inner thigh/heel.','Pause 1 second at the top, then lower slowly over 2-3 seconds. Do not let it drop.','You should feel this in the inner thigh of the bottom leg.','Small range is normal — quality of contraction beats height.','Add a light ankle weight on the bottom leg once bodyweight is easy.']},
  'Nordic Curl Eccentric':{muscle:'Hamstring (Eccentric)',category:'Foot Recovery',tips:['ANKLE-SAFE: knees down, feet anchored behind you — no weight through the foot or ankle.','Kneel on a pad. Anchor your heels/ankles under a bench, a loaded barbell, or have them held down. Body upright, hips extended.','Lower your torso toward the floor as SLOWLY as possible, resisting the whole way with your hamstrings. This is the eccentric — the entire point.','Only lower as far as you can control. The moment you lose control, catch yourself with your hands and push back up.','Do not use the hip as a hinge — keep a straight line from knees to shoulders throughout the descent.','Start with a very small controllable range and 3-5 reps. This is extremely demanding — hamstring soreness is expected.','The foot stays completely passive; all the work is in the hamstring lengthening under load.']},
  'Neutral-Grip Chin-Up / Assisted Pull-Up':{muscle:'Lats / Biceps',category:'Pull',tips:['ANKLE-SAFE: you are hanging, so ZERO load goes through the foot. If using an assisted machine, kneel on the pad - never stand on the platform.','Neutral or supinated grip only. Never pronated wide - that grip position aggravates the right shoulder.','Start from a full dead hang with shoulders packed DOWN. Depress the shoulder blades BEFORE the elbows bend.','Pull the chest toward the bar, elbows driving down and back, not flaring wide.','Lower under control over 3 seconds to a full hang. The lowering is where most of the growth happens.','This is the most stabiliser-demanding pull available to you right now - prioritise it.','Dead hangs at the bottom are therapeutic for the shoulder, so a few extra seconds hanging is a bonus, not wasted time.']},
  'Seated Cable Fly':{muscle:'Chest (Pec Major)',category:'Push',tips:['Seated on a bench between two cable stacks set at chest height. Feet rest on the floor unloaded.','Soft elbows held at a fixed angle throughout - this is not a press, the elbow angle does not change.','Bring the handles together in front of the sternum, thinking about squeezing the pecs rather than moving the hands.','STOP well short of a deep stretch at the back. Do not let the hands travel behind the shoulder line - that is the position that irritates the right shoulder.','Cable keeps constant tension across the whole range, unlike dumbbells which lose tension at the top.','Control the return over 3 seconds. Light weight, high quality.']},
  'Seated Cable Row (neutral grip)':{muscle:'Mid Back / Lats',category:'Pull',tips:['Seated with the chest tall. Feet rest on the platform WITHOUT pushing - do not brace or drive through the feet.','Neutral grip handle only. DEPRESS the shoulder blades first, then pull.','Pull the handle to the belly/hip, not the chest. Elbows stay close to the body.','Squeeze for 1 second at the back, then return under control to a full stretch, letting the blades protract.','If you feel this in the traps rather than the mid back, the weight is too heavy - drop it and re-set the blade depression.','Cable direction is fixed but your shoulder still picks its own arc, which is why this stays in over a fixed-path machine.']},
  'Seated Cable Triceps Pushdown':{muscle:'Triceps',category:'Push',tips:['Seated facing the stack, or standing tall if seated is not practical - the cable pulls UP, so foot loading is minimal either way.','Elbows pinned tight to the ribs and completely stationary. Only the forearm moves.','Push down to full lock-out, squeeze the triceps for 1 second.','Return only until the forearms are just past parallel - do not let the elbows drift forward.','Rope or straight bar both fine. Rope allows a slightly greater end-range spread.','Keep the shoulders down and back throughout - no leaning over the bar.']},
  'Seated Hip Abduction (machine)':{muscle:'Glute Medius',category:'Foot Recovery',tips:['ANKLE-SAFE: seated, pads on the outer thighs - the load never reaches the foot or ankle.','Sit tall with the lower back supported. Slight forward lean biases the upper glute.','Push the knees APART against the pads, squeezing the outer glutes.','Hold the fully open position for 1 second, then return SLOWLY over 3 seconds - do not let the stack slam.','This is APT priority work - glute medius strength directly supports pelvic position.','Higher reps work well here. Chase the burn rather than the load.']},
  'Seated Hip Adduction (machine)':{muscle:'Adductors (Inner Thigh)',category:'Foot Recovery',tips:['ANKLE-SAFE: seated, pads on the inner thighs - no load through the foot or ankle.','Sit tall, lower back supported against the pad.','Squeeze the knees TOGETHER, driving from the inner thigh.','Pause 1 second at the closed position, then open slowly over 3 seconds against resistance.','Do not force the open position into a stretch you cannot control - set the machine start position conservatively.','Balances the abduction work so the hip is trained in both directions.']},
  'Lying Leg Curl (machine)':{muscle:'Hamstrings',category:'Foot Recovery',tips:['CRITICAL PAD POSITION: set the ankle pad HIGH on the calf, well above the heel. The standard position sits on the Achilles insertion, which is exactly where the tendinosis and tear are.','If the machine will not allow a high pad position, SKIP this exercise and use the seated version instead.','Lie face down, hips pressed into the pad - do not let the hips lift as you curl.','Curl the heels toward the glutes, squeeze hard for 1 second at the top.','Lower over 3 seconds under full control. The eccentric is the growth driver.','Point the toes slightly to reduce calf involvement and keep the Achilles quiet.']},
  'Kneeling Single-Arm DB Row (on bench)':{muscle:'Lats / Mid Back',category:'Pull',tips:['ANKLE-SAFE: knee and same-side hand on the bench, opposite foot NOT planted on the floor under load. Never do this standing.','Set up with a flat back, hips square, chest roughly parallel to the floor.','DEPRESS the shoulder blade first, then row the dumbbell to the hip - not the armpit.','Elbow stays close to the body. Squeeze for 1 second at the top.','Lower over 3 seconds to a full stretch, letting the shoulder blade protract at the bottom.','Do not rotate the torso to help the weight up - if you need to twist, the dumbbell is too heavy.','Free weight means the right shoulder chooses its own path - that is why this stays in over a machine row.']},
  'Arm Ergometer':{muscle:'Cardiovascular / Upper Body',category:'Cardio',tips:['ANKLE-SAFE: arms only, seated, feet completely passive. The only truly zero-load cardio option available right now.','Sit tall, core braced, shoulders down and relaxed - do not shrug as fatigue builds.','Keep the elbows slightly bent, never locked out.','BREATHING IS THE PRIORITY: steady rhythmic breathing throughout. Do NOT hold your breath during hard intervals.','For intervals: 1 min hard / 1 min easy. Nasal-breathe the easy intervals to keep the effort honest.','Stop immediately if you feel lightheaded - note it and mention it to the cardiologist.']},
  'Pull-Buoy Swim':{muscle:'Cardiovascular / Upper Body',category:'Cardio',tips:['CRITICAL: NO KICK AT ALL. Buoy between the thighs, ankles still and relaxed. Kicking is the single most likely way to re-flare the Achilles.','Enter and exit via the pool STEPS, not the ladder - ladder rungs load the forefoot directly.','Upper body only. Focus on catch and pull mechanics since the legs are doing nothing.','Neutral shoulder position - avoid an aggressive overhead reach that pushes the right shoulder past comfortable range.','Steady aerobic effort, 20-30 min. This is conditioning, not a session to chase times in.','Breathe bilaterally if comfortable. Never hold your breath to extend a length.']},
  'Barbell Squat / Goblet Squat':{muscle:'Quad / Glute / Core',category:'Squat',tips:['Start with goblet squat (dumbbell at chest) to establish the pattern before loading a barbell.','Feet shoulder-width or slightly wider, toes turned out 15 to 30 degrees.','Brace your core completely before descending — create a rigid trunk throughout the rep.','Squat to at least parallel — thighs horizontal or below. Depth is where the stimulus is greatest.','Knees track in line with toes throughout. Do not allow them to cave inward.','For barbell: bar on upper traps (high bar) or rear delts (low bar). Elbows under the bar.']},
  'Pull-Up / Lat Pulldown (neutral grip)':{muscle:'Lat / Bicep / Mid Back',category:'Pull',tips:['Neutral grip (palms facing each other) is safest for your right shoulder — use a close parallel attachment.','For pulldown: sit tall, slight lean back (15 degrees). Pull to the upper chest, not behind the neck.','Pull your elbows down and back, not your hands down. This is the cue that fires the lats.','Start each rep from a full hang — do not shorten the range of motion.','Squeeze shoulder blades together and down at the bottom. Hold for one second.','Right arm: respect your current ROM. Do not force ranges that create impingement.']},
  'Hip Thrust (Barbell or Machine)':{muscle:'Glute / Hamstring',category:'Hinge',tips:['Upper back across the bench — shoulder blades, not the neck.','Feet flat, hip-width apart. Drive through your heels at the top.','Squeeze glutes as hard as possible at full extension. Chin tucked, neutral neck.','At the top: shins vertical, hips fully extended, glutes fully contracted.','Lower slowly — 2 to 3 seconds — until hips are just off the floor. Do not touch down between reps.','Posteriorly tilt the pelvis at the top (tailbone curling slightly under) for full glute contraction.']},
  'Low-Incline DB Press (neutral grip)':{muscle:'Upper Chest / Tricep / Front Delt',category:'Push',tips:['Set bench to 15 to 30 degrees only. Higher angles shift load increasingly to the front delt.','Neutral grip eliminates impingement risk — particularly important for your right shoulder.','Lower in a controlled arc to the upper chest — feel the stretch at the bottom.','Press back up and slightly inward. Dumbbells converge at the top.','Shoulder blades pulled back and down throughout. Do not let shoulders roll forward.','Wrists stacked over elbows. Do not let them bend backward under load.']},
  'Single-Arm DB Row (incline bench)':{muscle:'Back / Bicep / Rear Delt',category:'Pull',tips:['Chest supported on an incline bench at 30 to 45 degrees. Removes lower back strain completely.','Pull toward the hip, not the shoulder. Elbow tracks close to the body.','Full stretch at the bottom — let the dumbbell hang fully. Short range defeats the purpose.','Lead with your elbow. Your hand is just a hook connecting you to the weight.','Squeeze shoulder blade at the top. Hold for one full second before lowering.','Both arms must do equal work. Note if one side is weaker.']},
  'Side Plank':{muscle:'Oblique / Core / Glute Med',category:'Core',tips:['Forearm on the floor, elbow directly under your shoulder. Stack or stagger your feet.','Lift hips until your body forms a straight line from head to heel.','Do not let the hips sag or pike. Push the floor away with your forearm.','Brace your core and squeeze your glutes — both contribute to lateral stability.','Eyes forward, neck neutral. Keep breathing throughout.','Progress by adding hip dips or increasing hold time by 5 seconds per session.']},
  'Reverse Crunch':{muscle:'Lower Abdominal / Hip Flexor',category:'Core',tips:['Lie on your back, hands under your glutes or gripping a bench for stability.','Start with knees bent at 90 degrees, feet just off the floor.','Curl your pelvis toward your chest — movement from the abs, not a hip flexor swing.','Lower back should peel off the floor as you curl upward. This is the range you want.','Lower slowly and with control. Do not let feet touch the floor between reps.','This targets the lower rectus abdominis — the region most often undertrained.']},
  'Bulgarian Split Squat':{muscle:'Quad / Glute / Hip Flexor',category:'Squat',tips:['Rear foot elevated on a bench, laces down or ball of foot on the pad.','Step forward enough that your front knee does not travel far past your toes at the bottom.','Upright torso = more quad. Slight forward lean = more glute.','Drop the back knee straight down toward the floor. Slow and controlled — 3 seconds.','Drive through the front heel to stand. Do not push off with the back foot.','One of the most demanding lower body exercises available. Respect the load.']},
  'Bent-Over Barbell / DB Row':{muscle:'Back / Bicep / Rear Delt',category:'Pull',tips:['Hinge to roughly 45 degrees and hold that position firmly throughout.','Pull to your lower ribcage — not your belly, not your upper chest.','Alternate grip weekly: overhand for more upper back, underhand for more lat and bicep.','Lead with the elbow. Your hand is just a hook.','Lower with full control — do not drop it. The eccentric matters as much as the pull.','Core braced throughout. No spinal rotation as you row.']},
  '45deg Back Extension / KB Good Morning':{muscle:'Hamstring / Glute / Lower Back',category:'Hinge',tips:['For back extension: position the pad just above your hip bones, not at your waist.','Hinge from the hips — feel the hamstring stretch on the way down. Not a lower back crunch.','For KB good morning: hold at your chest. Hinge until you feel a full hamstring stretch, then drive hips forward.','Squeeze glutes hard at the top — full hip extension on every rep.','2 to 3 seconds on the descent. The controlled eccentric is the primary stimulus.','Keep a neutral spine. The movement happens at the hip, not in the lumbar spine.']},
  'Cable Lateral Raise':{muscle:'Medial Deltoid',category:'Push',tips:['Set the cable to the lowest position. Stand side-on, cable in the far hand — this gives a better line of pull for the medial delt than a dumbbell.','Keep a slight forward lean (10-15 degrees) and a soft bend in the elbow throughout.','Raise your arm out to the side and stop at shoulder height — do not go above. Especially important for your right shoulder.','Lead with your elbow, not your wrist. Think about lifting your elbow up and out.','Lower slowly — 3 seconds down. The eccentric is where the medial delt stimulus is greatest.','Start light (5-7kg max). This muscle responds well to volume and controlled reps, not heavy loading.','This directly targets shoulder width — the medial deltoid is the muscle that creates the widest-shoulder look from the front.']},
  'Standing Calf Raise':{muscle:'Gastrocnemius / Soleus',category:'Lower Body',tips:['Stand on a step or plate edge with heels hanging off. Feet hip-width, toes pointing slightly forward.','Lower your heels as far as possible to get a full stretch at the bottom — this is the range most people skip and where the growth stimulus is.','Drive up onto your toes as high as possible. Squeeze hard at the top for 1 full second.','Take 3 seconds to lower down. Rushed reps with no range of motion are largely wasted.','The gastrocnemius (the visible calf muscle) responds best to full-range, controlled reps. Do not bounce out of the bottom.','Calves are high-endurance muscles — higher rep ranges (12-20) with controlled eccentrics tend to produce better results than low reps heavy.']},
  'Cable Chest Fly (chest height)':{muscle:'Chest / Front Delt',category:'Push',tips:['Set cables at chest height. This angle maximises pec activation with the shoulder in a safe position.','Step forward so arms are slightly behind the cable line at the start — creates a full pec stretch.','Slight forward lean (10 to 15 degrees) to align with the chest fibres.','Think about hugging a large tree — the arc comes from the shoulder joint, not elbow bending.','Maintain a soft bend in the elbow throughout. Do not fully extend or fully flex the arm.','Squeeze the pecs hard as hands come together. Hold for one second.']},
  'Push-Up Variation':{muscle:'Chest / Tricep / Core',category:'Push',tips:['Hands slightly wider than shoulder-width. Elbows at 45 degrees — not flared wide.','Rigid plank from head to heel. No sagging hips, no piked hips.','Lower your chest to the floor. Full range every rep. No half reps.','Archer push-up: shift your weight to one arm as you lower — significantly increases unilateral load.','Close-grip: hands under the shoulders, elbows close to the body — more tricep emphasis.','Pause at the bottom for 1 second to remove elastic rebound and increase time under tension.']},
  'Cable Wood Chop':{muscle:'Oblique / Core / Shoulder',category:'Core',tips:['Stand sideways to the cable, feet shoulder-width, slight knee bend.','The rotation comes from your core and hips rotating together — not arm pulling.','Let your eyes follow your hands. This ensures the rotation is real, not just arm swing.','The trail hip should open as you rotate. Think full trunk rotation, loaded and controlled.','Control the return — the cable will try to pull you back. Resist it with the same muscles.']},
  'Bird Dog':{muscle:'Core / Lower Back / Glute',category:'Core',tips:['On all fours: hands under shoulders, knees under hips. Spine neutral — not arched or rounded.','Extend the opposite arm and leg simultaneously. Move slowly — speed defeats the purpose.','Hold for a full 3 seconds at full extension. The extended hold recruits more deep stabiliser muscle.','Keep your hips completely level. Do not let the extending hip hike up.','Reach your heel toward the wall behind you rather than lifting your leg toward the ceiling.','This builds coordination between the glutes and opposite shoulder — relevant to running and lifting.']},
  'Band External Rotation at Side':{muscle:'Rotator Cuff (Infraspinatus / Teres Minor)',category:'Shoulder Rehab',tips:['Light resistance band, elbow bent at 90 degrees and tucked firmly at your side.','The elbow stays completely fixed. Movement is purely forearm rotation outward — nothing else moves.','Perform slowly and deliberately. Zero pain. Stop if you feel any catching or sharp sensation.','Hold at end range for 1 to 2 seconds on every rep.','This targets the external rotators — the muscles most commonly weakened after shoulder surgery.','Right arm only. Range will improve over weeks as the repair consolidates.']},
  'Side-Lying External Rotation (DB)':{muscle:'Rotator Cuff (Infraspinatus)',category:'Shoulder Rehab',tips:['Lie on your left side. Right arm bent at 90 degrees, elbow resting at your side.','Use the lightest dumbbell available. This is precision work, not strength work.','Rotate the forearm upward in a slow arc. Stop well before any pain or catching.','Lower with full control — 2 to 3 seconds down.','Range will increase over weeks as the posterior capsule loosens.','Do not compensate by rolling your whole shoulder backward. Isolate the rotation.']},
  'Prone Y Raise':{muscle:'Lower Trap / Serratus Anterior',category:'Shoulder Rehab',tips:['Lie face down on a bench. Arms extended in a Y shape overhead, thumbs pointing up.','Raise both arms simultaneously, only 4 to 6 inches off the surface.','Focus on the lower trapezius: shoulder blades down and together as you raise.','The movement is small and controlled. No momentum, no jerking.','No weight needed initially. Progress to a very light plate only when bodyweight is genuinely easy.','This directly addresses the weakness that develops after shoulder surgery.']},
  'Prone T Raise':{muscle:'Mid Trap / Posterior Delt',category:'Shoulder Rehab',tips:['Lie face down. Arms out to the side in a T shape, thumbs pointing up.','Raise both arms simultaneously — squeeze shoulder blades together as you lift.','Hold at the top for 2 seconds. Lower slowly.','Keep your neck neutral — do not strain it upward.','Targets the mid-trapezius and posterior deltoid, which stabilise the shoulder blade.','Progress only when current level feels easy across all sets.']},
  'Serratus Anterior Wall Press':{muscle:'Serratus Anterior',category:'Shoulder Rehab',tips:['Stand an arms length from a wall. Hands flat on the wall at shoulder height.','Push the wall away — the movement is the shoulder blade protracting forward around the ribcage.','You should feel the muscle underneath your armpit engaging. That is the serratus.','Hold the end position for 2 seconds, then slowly return.','Serratus weakness is extremely common after shoulder surgery. It contributes to impingement.','Think shoulder blades moving forward and around the ribs, not just pushing with your arms.']},
  'Sleeper Stretch':{muscle:'Posterior Shoulder Capsule',category:'Shoulder Rehab',tips:['Lie on your right side. Right arm bent at 90 degrees, pointing toward the ceiling.','Using your left hand, gently push the right forearm toward the floor — creating internal rotation.','The stretch should be felt deep in the back of the shoulder. Stop well before any sharp pain.','Hold for 30 seconds. Breathe steadily and allow the tissue to relax gradually.','This stretches the posterior capsule, which tightens after surgery and restricts internal rotation.','Do not force the range. Gradual stretching over weeks is far safer than aggressive pushing.']},
  'Hip Flexor Lunge Stretch':{muscle:'Hip Flexor / Psoas / Quad',category:'Stretch',tips:['Back knee on the floor, front foot flat with shin vertical.','Drive your hips forward until you feel the stretch in the front of the back hip.','Keep your torso upright and core lightly braced — do not arch your lower back.','For a deeper stretch, raise your same-side arm overhead and lean slightly away.']},
  'Lying Figure-Four Glute Stretch':{muscle:'Glute / Piriformis',category:'Stretch',tips:['Lie on your back. Cross one ankle over the opposite knee to create a figure 4 shape.','Pull the bottom leg toward your chest or push the crossed knee gently away.','Stretch should be felt deep in the glute of the crossed leg. If felt in the knee, adjust foot position.','On each exhale allow the hip to relax further into the stretch.']},
  'Standing Hamstring Stretch':{muscle:'Hamstring',category:'Stretch',tips:['One foot on a bench or step, leg straight.','Hinge forward at the hip — not by rounding the back — until you feel the stretch.','Keep your chest up and spine long. A flat back gives a far more effective stretch.','Hold 45 seconds per side.']},
  'Thoracic Extension over Roller':{muscle:'Thoracic Spine / Pec Minor',category:'Stretch',tips:['Roller across your mid-back — the thoracic spine, not the lumbar.','Support your head with hands behind your neck. Let the upper back extend over the roller.','Roll slightly up and down to find the stiffest segments and spend more time there.','This addresses thoracic stiffness from pressing and rowing — and opens the chest significantly.']},
  'Wall Chest Opener':{muscle:'Chest / Front Delt / Bicep Tendon',category:'Stretch',tips:['Stand sideways to a wall. Palm flat on the wall at shoulder height.','Slowly rotate your body away from the wall, opening the chest.','Right arm: go only as far as comfortable. Do not force ranges that cause shoulder discomfort.','Feel the stretch across the front of the chest and shoulder.']},
  "Child's Pose with Side Reach":{muscle:'Lat / Thoracic Spine / Shoulder',category:'Stretch',tips:["Child's pose: knees wide, hips back toward heels, arms extended forward.",'Walk hands to one side — feel the stretch in the opposite lat and side of the ribcage.','Hold for 30 seconds per side. Breathe deeply into the stretch.','The lat is often tight after heavy rowing sessions — this directly addresses that.']},
  '90/90 Hip Stretch':{muscle:'Hip / Glute / Piriformis / TFL',category:'Stretch',tips:['Sit on the floor with both legs bent at 90 degrees — front leg in front, back leg to the side.','Sit tall. Do not collapse into the hip — find length through the spine first.','Hinge forward over the front leg to deepen the stretch in the front hip.','Switch sides. Both hips benefit after any lower body session.']},
  'Shoulder Circles':{muscle:'Shoulder / Rotator Cuff',category:'Swim Warm-Up',tips:['Stand tall. Circle the arm slowly — forward circles first, then backward.','Keep the movement pain-free throughout. Stop if you feel any catching.','Start with small circles and gradually increase the range as the joint warms up.']},
  'Band External Rotations':{muscle:'Rotator Cuff',category:'Swim Warm-Up',tips:['Same movement as your rehab external rotation, but with a lighter band.','This is preparation, not a fatigue exercise. Keep the load minimal.','Goal is to activate and wake up the rotator cuff before it is loaded by freestyle.']},
  'Scapular Shrugs':{muscle:'Trap / Serratus / Rhomboid',category:'Swim Warm-Up',tips:['Stand or sit tall. Shrug both shoulder blades upward, then pull them back and down.','Think: up, back, down — in a slow controlled loop.','Each rep should be deliberate — feel the muscles between and around the shoulder blades working.']},
  'Seated Leg Curl (machine)':{muscle:'Hamstring',category:'Foot Recovery',tips:['Set the machine so the pad sits just above the back of your ankle (Achilles area), not on your calf.','Adjust the back pad so your knees line up with the pivot point of the machine.','Curl both legs down toward your glutes in a controlled arc. Focus on full hamstring contraction at the end.','3-second eccentric on the way back up — this is where most of the hypertrophy stimulus comes from.','Foot is fully supported throughout — zero ground reaction force on the metatarsals.','Your primary hamstring movement during the foot recovery block. Push intensity here to make up for missing posterior chain work elsewhere.']},
  'Seated Leg Extension (machine)':{muscle:'Quadricep',category:'Foot Recovery',tips:['Pad should sit just above your ankle, in front of the shin. Adjust seat so knees align with the pivot.','Drive the weight up by extending the knee — squeeze the quad hard at the top for 1 full second.','Lower with full control over 3 seconds. Quads grow on the eccentric.','Toes can point neutral or slightly outward. Feel free to vary across sessions to hit the quad differently.','Your foot is fully supported — no ground force at all. Push the load harder than usual since this is your only quad volume right now.','12-15 reps with controlled tempo will produce more growth than 6 heavy reps with momentum.']},
  'Hack Squat / Seated Leg Press':{muscle:'Quad / Glute / Hamstring',category:'Foot Recovery',tips:['Place feet mid-platform, shoulder-width apart. Avoid the very edge of the platform where heel/toe pressure spikes.','Distribute pressure across the whole foot — neither heel-only nor ball-only. This minimizes any point pressure on the 5th metatarsal.','Lower until knees are at 90 degrees or slightly past. Do not let the lower back come off the pad.','Drive through full foot to extend. Stop just short of locking out at the top to maintain quad tension.','Take 2-3 seconds on the descent. The eccentric is where the muscle grows.','If any foot discomfort, stop immediately. Substitute with leg extensions only.']},
  'Chest-Supported T-Bar Row':{muscle:'Back / Bicep / Rear Delt',category:'Foot Recovery',tips:['Chest pressed firmly into the pad throughout. The pad supports your bodyweight — no foot drive needed.','Pull the bar toward your lower chest/upper abdomen. Lead with the elbows.','Squeeze the shoulder blades together hard at the top. Hold for 1 second.','Lower with full control over 2-3 seconds — the eccentric is critical.','Neutral or pronated grip both work. Neutral is shoulder-friendlier for your right arm.','This is one of the best back exercises during foot recovery — full lat stimulus with zero standing load.']},
  'Chest-Supported DB Row':{muscle:'Back / Bicep / Rear Delt',category:'Foot Recovery',tips:['Set an incline bench to roughly 30 degrees. Lie face down with chest fully on the bench.','Hold a DB in each hand, arms extended below you.','Pull both DBs toward your hips simultaneously. Elbows track close to the body.','Squeeze shoulder blades together at the top, hold 1 second.','Lower with control. Full stretch at the bottom — let the DBs hang.','Same movement quality as a regular row but zero spinal loading and zero foot involvement.']},
  'Glute Bridge (Barbell or DB)':{muscle:'Glute / Hamstring',category:'Foot Recovery',tips:['Lie on your back, knees bent, feet flat on the floor at hip-width.','Place the barbell or DBs across your hips (use a pad if barbell — your hip bones will thank you).','Drive through your heels and squeeze the glutes hard to lift the hips.','Push your hips up until your body forms a straight line from knees to shoulders. Hold for 1 second.','Lower with control over 2 seconds. Do not slam back down.','Foot stays flat with the entire surface in contact with the floor — distributes load far better than a hip thrust drive position.','For your foot specifically: keep your weight slightly toward the heel rather than the ball of the foot.']},
  'Half-Kneeling Pallof Press (left knee)':{muscle:'Core / Oblique',category:'Foot Recovery',tips:['Set cable to chest height. Kneel on your LEFT knee with your right knee up — your right (sore) foot lifts off the floor or rests very lightly behind you.','Hands together at your sternum. Press the handle out and hold for 2 seconds.','Resist the cable trying to rotate you toward the machine — anti-rotation is the goal.','Slow, controlled return. Keep the press level — do not let it dip toward the cable.','The half-kneeling position keeps your right foot completely off the floor — no ground reaction force.','If kneeling is uncomfortable, do this seated on a bench with the same pressing pattern.']},
  'Half-Kneeling Cable Wood Chop (left knee)':{muscle:'Oblique / Core',category:'Foot Recovery',tips:['Cable set high. Kneel on your LEFT knee, right knee up. Your right (sore) foot lifts off the floor or rests lightly.','Grip cable handle with both hands above your shoulder.','Pull diagonally down and across to the opposite hip. Rotate from the trunk, not the arms.','Eyes follow the hands — confirms full rotation.','Control the return. The cable will try to pull you back — resist with the obliques.','Same movement pattern as standing but no foot load at all.']},
  'Modified Side Plank (from knee)':{muscle:'Oblique / QL / Glute Med',category:'Foot Recovery',tips:['Side-lying with your forearm on the floor, elbow under your shoulder.','Bend the bottom knee at 90 degrees — your shin and lower leg are on the floor.','Keep the top leg straight and stacked above the bottom leg, or for less load just keep both knees stacked.','Lift your hips so your body forms a straight line from knees to head.','Right foot stays off the floor in either variant — zero metatarsal involvement.','Hold for 20-30 seconds. The from-knee version still produces strong oblique and QL contraction.']},
  'Seated Cable Row':{muscle:'Back / Bicep / Mid Back',category:'Foot Recovery',tips:['Sit on the bench with feet flat on the platform. Slight knee bend.','Pull the handle to your lower ribs/upper abdomen. Elbows track close to the body.','Squeeze shoulder blades together hard at the back position. Hold 1 second.','Lower with full control over 2-3 seconds. Allow a full stretch through the lats at the front.','Maintain an upright torso — do not let the lower back round at the front.','Feet on the platform are passive — no ground force, no metatarsal load.']},
  'Seated Hip CARs':{muscle:'Hip Joint / Capsule',category:'Foot Recovery Warm-Up',tips:['Sit on a bench or chair, both feet flat on floor.','Lift one knee toward your chest, then circle it outward in the largest controlled circle you can make.','Move slowly — quality over speed. Each circle should take 3-5 seconds.','8 reps each direction, each leg. Keep the standing leg planted.','This wakes up the hip joint capsule and the hip stabilisers without any ground impact on the foot.']},
  'Seated Cat-Cow':{muscle:'Thoracic Spine / Lumbar / Core',category:'Foot Recovery Warm-Up',tips:['Sit at the edge of a chair or bench, hands on your thighs.','Cat: round the spine, tuck the pelvis, drop the chin to chest. Exhale fully.','Cow: arch the spine, lift the chest and chin, stick the tailbone back. Inhale fully.','Move slowly with each breath. 10 reps total.','Mobilises the entire spine without any standing load on the foot.']},
  'Seated Thoracic Rotation':{muscle:'Thoracic Spine / Oblique',category:'Foot Recovery Warm-Up',tips:['Sit tall on a bench. Hands behind your head, elbows wide.','Rotate your upper body to one side — keep the hips facing forward and stable.','Hold the end range for 1-2 seconds. Feel the stretch through the mid-back.','Return to centre, then rotate the other way. 8 reps each side.','Especially valuable before pulling sessions — primes the thoracic spine.']},
  'Quadruped Hip Extension':{muscle:'Glute Max / Hamstring',category:'Foot Recovery',tips:['Start on hands and knees — hands under shoulders, knees under hips. Spine neutral.','Keeping the working knee bent at 90 degrees, drive the heel toward the ceiling.','Squeeze the glute hard at the top. Without the squeeze, you are just swinging the leg.','Lower with control over 2 seconds. Do not let the leg drop.','Keep your core braced — do not let your lower back arch as you lift.','Both feet stay completely off the floor — working leg lifts back, the other knee stays planted.','Foot-free for the recovering foot. Excellent glute activation without any standing or weight bearing.']},
  'Lying DB Pullover':{muscle:'Lat / Chest / Serratus',category:'Foot Recovery',tips:['Lie back on a flat bench. Hold ONE dumbbell with both hands at your chest, palms cupping the inner end.','IMPORTANT: feet up on the bench (knees bent) for foot recovery — completely off the floor.','Press the DB up over your chest, arms extended with a slight elbow bend. The bend stays fixed throughout.','Lower the DB in a controlled arc behind your head until you feel a deep stretch through the lats and chest.','Pull the DB back up over your chest. Lead with the elbows pulling forward, not the wrists.','3 seconds on the lowering phase — the stretch under load is the primary stimulus.','Hits both lat and chest stretch — especially valuable when standing rows are off limits.']},
  'Side-Lying Hip Abduction':{muscle:'Glute Medius / Glute Minimus',category:'Foot Recovery',tips:['Lie on your side with hips stacked, bottom leg bent for stability, top leg straight.','Lift the top leg up toward the ceiling without rotating the hips — keep them stacked vertically.','Pause for 1 second at the top. Control matters more than height — stop where you can keep hips stacked.','Lower with control over 2 seconds. Do not let the leg drop.','You should feel this in the side of the hip, not in the lower back or front of the thigh.','For added load, hold a light DB on the lifting leg or wear an ankle weight.','Foot-free, great glute med activation, especially valuable for restoring hip stability after foot rest.']},
  'Lying DB Row (prone, on bench)':{muscle:'Back / Bicep / Rear Delt',category:'Foot Recovery',tips:['Lie face down (chest down) on a flat bench raised on blocks if possible, or a high incline bench.','Both arms hang straight down with a DB in each hand.','IMPORTANT: feet hang off the end of the bench — completely off the floor.','Pull both DBs simultaneously toward your hips. Elbows track close to the body.','Squeeze shoulder blades together hard at the top. Hold for one second.','Lower with full control over 2-3 seconds. Allow a complete stretch at the bottom.','Body must stay rigid — no torso rocking. The lats and rhomboids do all the work.','Feet completely passive throughout — genuinely foot-free row variant.']},
  'DB Chest Fly (flat bench)':{muscle:'Chest / Front Delt',category:'Foot Recovery',tips:['Lie back on a flat bench with one DB in each hand, palms facing each other.','IMPORTANT: feet up on the bench (knees bent) for the foot recovery block — removes any foot load.','Press the DBs up to start with a slight elbow bend — this bend is fixed throughout the movement.','Lower the DBs out in a wide arc until you feel a deep stretch across the chest.','Bring them back together over the chest in a hugging motion. Squeeze the pecs at the top.','3 seconds on the eccentric. The stretch under load is the primary growth stimulus.','Do not bend the elbows during the rep — that turns it into a press, not a fly.','Same chest stimulus as cable fly but completely foot-free.']},
  'Side-Lying DB Lateral Raise':{muscle:'Medial Deltoid',category:'Foot Recovery',tips:['Lie on your side on a flat bench (or floor) with one DB in your top hand.','Keep a soft elbow bend. Lift the DB up and over toward the ceiling in a wide arc.','Stop at shoulder height (about 90 degrees from torso). Going higher recruits the trap, not the medial delt.','Lower with control over 3 seconds. The eccentric drives most of the medial delt growth.','Use very light weight (3-5kg max). The lying position removes momentum and exposes any cheating.','For your right shoulder: stay within pain-free range. If 90 degrees is uncomfortable, stop earlier.','Foot-free isolation that targets the muscle responsible for shoulder width better than standing variations.']},
  'Lying DB Tricep Extension (Skullcrusher)':{muscle:'Tricep',category:'Foot Recovery',tips:['Lie on a flat bench. Hold a DB in each hand, arms extended straight up over the chest.','IMPORTANT: feet up on the bench for foot recovery, knees bent.','Bend at the elbows only — lower the DBs toward your forehead (or just past it).','Keep the elbows pointing toward the ceiling — they should not flare outward.','Pause for one second at the bottom (DBs near the temples), then extend the arms back up.','For your right shoulder: this is shoulder-friendly because the upper arm stays vertical.','3 seconds on the lowering phase. The stretch on the long head of the tricep is the growth stimulus.']},
  'Incline DB Curl (lying back)':{muscle:'Bicep (Long Head)',category:'Foot Recovery',tips:['Set an incline bench to 45-60 degrees. Lie back with arms hanging fully toward the floor.','IMPORTANT: feet up on the bench seat or on a footrest, not on the floor.','The arms hanging back behind the body puts the long head of the bicep into a deep stretch.','Curl the DBs up keeping the elbows pinned in place — no shoulder movement.','Squeeze hard at the top, then lower with full control over 3 seconds.','The stretched position is what makes this curl variant superior for the long head of the bicep.','Foot-free isolation that hits the bicep in its strongest hypertrophy position.']},
  'Seated DB Lateral Raise':{muscle:'Medial Deltoid',category:'Shoulders',tips:['Sit upright on a bench, a DB in each hand at your sides, slight forward lean optional.','Lead with the elbows, not the hands. Raise the DBs out to the sides in a wide arc.','Stop at shoulder height — about 90 degrees from the torso. Higher recruits the trap instead of the medial delt.','Tiny pause at the top, then lower over 3 seconds. The eccentric drives medial delt growth.','For your right shoulder: stay within a pain-free arc. If the top of the range pinches, stop lower.','Light weight, high reps. This is an isolation movement — momentum ruins it.','Sitting removes leg drive and cheating, so 6-8kg will feel plenty.']},
  'DB Hammer Curl':{muscle:'Bicep / Brachialis / Forearm',category:'Arms',tips:['Stand or sit tall, a DB in each hand, palms facing each other (neutral grip) throughout.','Curl without rotating the wrist — the neutral grip is what shifts load onto the brachialis and forearm.','Keep the elbows pinned to your sides. No swinging, no shoulder movement.','Squeeze at the top, then lower over 2-3 seconds.','Alternate arms or curl both together — both work. Alternating lets you go slightly heavier.','The brachialis sits under the bicep — building it pushes the bicep up and adds arm thickness.']},
  'DB Curl':{muscle:'Bicep',category:'Arms',tips:['Stand or sit tall, a DB in each hand, palms facing forward (supinated) at the bottom.','Curl up keeping the elbows fixed at your sides — they should not drift forward.','Supinate fully — turn the pinky up slightly at the top for peak bicep contraction.','Squeeze hard at the top, then lower over 2-3 seconds. Do not let the DBs drop.','Full range: arms straight at the bottom, full contraction at the top.','If you have to swing to lift it, the weight is too heavy — drop it and keep form strict.']},
  'Close-Grip DB Floor Press':{muscle:'Tricep / Inner Chest',category:'Arms',tips:['Lie on the floor (or a bench), a DB in each hand, palms facing each other, DBs touching over your chest.','Keep the DBs close together throughout — elbows tucked at roughly 45 degrees to the body.','Lower until your upper arms touch the floor (the floor caps the range, protecting the shoulder).','Pause briefly when the triceps touch down, then press back up keeping the DBs together.','The close, neutral grip and tucked elbows make this shoulder-friendly for your right side.','Drive through the triceps, not the shoulders. Squeeze the triceps hard at lockout.']},
  'Prone Rear-Delt Raise':{muscle:'Rear Deltoid / Upper Back',category:'Shoulders',tips:['Lie face down (chest down) on an incline bench, or bent over with chest supported. A DB in each hand hanging down.','Raise the DBs out to the sides in a wide arc, leading with the elbows, thumbs roughly up.','Stop when the arms are level with the body. Squeeze the rear delts and upper back at the top.','Lower over 3 seconds. The slow eccentric is where the rear delt growth happens.','Keep it light — 4-8kg. Rear delts respond to control and reps, not heavy load.','Chest-supported position removes lower-back strain and any momentum. Strict form only.']},
  'Single-Leg Calf Raise':{muscle:'Gastrocnemius / Soleus',category:'Calf',tips:['REINTRODUCE FROM WEEK 3 ONLY — this loads the 5th metatarsal directly through the ball of the foot.','Stand on one foot on the edge of a step, heel hanging off, holding a DB in the same-side hand for balance and load.','Rise up onto the ball of the foot as high as possible. Pause and squeeze the calf at the top for 1 second.','Lower slowly over 3 seconds, getting a full stretch at the bottom (heel below the step).','Start very light and watch the foot closely — any lateral foot pain means stop and drop back.','Full range and the top squeeze matter more than load for calf growth.']},
  'Standing Calf Raise':{muscle:'Gastrocnemius / Soleus',category:'Calf',tips:['REINTRODUCE FROM WEEK 3 ONLY — direct load through the ball of the foot and 5th metatarsal.','Stand on the edge of a step, balls of both feet on the edge, heels hanging off. Hold DBs at your sides.','Rise up as high as possible onto the balls of the feet. Squeeze the calves hard at the top for 1 second.','Lower slowly over 3 seconds into a deep stretch (heels below the step level).','Keep the knees straight (not locked) to bias the gastrocnemius.','Watch the foot. Any lateral tenderness during or after = stop, regress, reassess.']},
  'DB Step-Up (low box)':{muscle:'Quad / Glute',category:'Quad',tips:['Use a low box or step (knee-height or lower while the ankle is settling). A DB in each hand at your sides.','Place the whole foot on the box. Drive through the heel of the top leg to stand up fully.','Minimise push-off from the trailing foot — the top leg should do the work.','Control the descent over 2-3 seconds. Do not just drop back down.','Lower box = less ankle demand. Raise the box height only as the ankle proves it can handle it.','Complete all reps on one leg before switching, or alternate — both fine. Keep the torso tall.']},
  'Hollow Hold':{muscle:'Deep Core / Rectus Abdominis',category:'Core',tips:['Lie on your back. Press your lower back firmly into the floor — this contact must never break.','Lift the shoulders and legs off the floor, arms extended overhead, forming a shallow banana shape.','The lower the legs, the harder it is. Keep them only as low as you can hold without the back arching.','Breathe shallowly and keep the core braced throughout the hold.','If the lower back lifts off the floor, raise the legs higher or bend the knees to regress.','Build hold time by 5 seconds per session. A strong hollow position transfers to every other lift.']},
  'Lying Leg Raise':{muscle:'Lower Abdominal / Hip Flexor',category:'Core',tips:['Lie on your back, hands tucked under your glutes for lower-back support, legs straight.','Keep the lower back pressed into the floor throughout — this is non-negotiable.','Raise the legs to vertical (or as far as control allows), keeping them straight or with a soft knee.','Lower slowly over 3 seconds. Stop just before the heels touch the floor — keep constant tension.','If the lower back arches off the floor on the way down, bend the knees more or reduce the range.','Slow and controlled beats fast and many. The eccentric is where the lower abs work hardest.']},
  'Couch Stretch':{muscle:'Hip Flexor / Quad',category:'Stretch',tips:['Set up against a sofa or wall. Back foot up on the sofa, laces down, front foot planted forward.','Front shin should be roughly vertical — knee over ankle, not past your toes.','Squeeze the glute of the back leg hard. This is the cue that drives the actual hip flexor stretch.','Tuck the pelvis under — posterior tilt. If you just lunge forward without tilting, you arch the lower back instead of stretching the hip flexor.','Upright torso. Resist the urge to lean forward.','It SHOULD feel uncomfortable in the front of the rear hip — that is the hip flexor stretching. If it feels nothing, your pelvis is not tucked.','90s per side. Breathe through it. This is the single most important stretch for the APT pattern.']},
  '90/90 Hip Flexor Stretch':{muscle:'Hip Flexor / Quad',category:'Stretch',tips:['Half-kneeling position: one knee down, other foot forward. Both knees at roughly 90 degrees.','Hands on the front thigh for balance and posture cues.','Tuck the pelvis under FIRST — posterior tilt — before moving forward. This is non-negotiable.','Drive the hips forward (not the torso) until you feel a stretch in the front of the rear hip.','Squeeze the glute of the kneeling leg to reinforce the stretch.','Upright torso throughout. If you lean forward, you cheat the stretch.','60s per side. If the kneeling knee complains, put a folded towel under it.']},
  'Figure-4 Glute Stretch':{muscle:'Glute / Piriformis',category:'Stretch',tips:['Lie on your back. Cross one ankle over the opposite knee — the figure-4 shape.','Flex the foot of the crossed leg (toes pulled toward shin) to protect the knee.','Reach through and pull the bottom leg toward your chest. Both hands behind the bottom thigh.','You should feel the stretch in the glute of the crossed leg, not the lower back.','Keep the head and shoulders relaxed on the floor. Do not crunch up.','60s per side. Glute tightness reinforces the APT pattern — this directly addresses it.','For a deeper stretch, gently press the crossed knee away from your chest with your same-side hand.']},
  'Banded Clamshells':{muscle:'Glute Medius',category:'Stretch',tips:['Side-lying, hips stacked vertically, knees bent at 90 degrees, feet together.','Light resistance band looped just above the knees.','Keep feet pressed together and the bottom leg still. Rotate the top knee upward like a clamshell opening.','Hold 1 second at the top with a hard squeeze of the side glute.','Do NOT let the pelvis roll back as you lift the knee — that recruits the lower back instead of the glute med.','Slow eccentric — 2 seconds back down.','Glute med activation is the most commonly weak link in APT and lower-back pain patterns. Do not skip.','Keep a band by the door so there is no friction to skip this.']},
  "World's Greatest Stretch":{muscle:'Hip Flexor / T-Spine / Groin / Ankle',category:'Stretch',tips:['Step into a deep forward lunge — front knee at 90 degrees, back leg extended.','Place the SAME-SIDE hand on the floor inside the front foot (right hand inside right foot).','Reach the opposite arm up toward the ceiling, rotating the chest open. Eyes follow the lifted hand.','Hold for 1-2 seconds at the top of the rotation.','Return the hand down, then step into the lunge on the other side.','This single movement mobilises hip flexor, groin, thoracic spine, shoulder, and ankle in one chain.','5 reps each side, slow and deliberate. Quality over speed.']},
  'DB Squat (held at sides)':{muscle:'Quad / Glute',category:'Squat',tips:['Hold a DB in each hand at your sides (suitcase grip), arms straight, palms facing your body.','Feet shoulder-width, toes turned out slightly. This is a different loading pattern from goblet squat — the weight is lower and further from the torso.','Descend under control — 3 seconds down, brief pause at the bottom, 1 second up (3-1-1 tempo).','No breath-holding. Exhale on the way up, inhale at the bottom.','Keep the torso tall throughout — the side-hold position makes it easier to stay upright than a goblet squat.','Do not let the DBs swing. They should track straight down alongside your legs the whole rep.']},
  'Plank':{muscle:'Core / Deep Stabilisers',category:'Core',tips:['Forearms on the floor, elbows directly under your shoulders, body in a straight line from head to heel.','Brace your core hard and squeeze your glutes — both are needed to keep the hips from sagging.','Do not let the hips pike up or sag down. A straight line is the entire point of the exercise.','Neutral neck — look at a point on the floor slightly ahead of your hands.','Breathe throughout. Holding your breath adds nothing and tires you out faster.','Progress by adding hold time (5s increments) before adding any load or instability.']},
  'DB Floor Press (neutral grip)':{muscle:'Chest / Tricep / Front Delt',category:'Push',tips:['Lie on the floor, knees bent, feet flat. A DB in each hand, palms facing each other (neutral grip).','The floor caps how far your elbows can travel — this is a deliberate, shoulder-friendly limit on range of motion.','Lower until your upper arms touch the floor, then pause briefly before pressing back up.','Press up and slightly inward — the DBs can converge at the top for extra chest contraction.','This is a genuinely different exercise from a bench press variant: the floor removes the bottom-range shoulder stretch that can provoke a healing shoulder.','Keep shoulder blades pulled back and down into the floor throughout — do not let them roll forward.']},
  'Decline Weighted Sit-Up':{muscle:'Rectus Abdominis / Hip Flexor',category:'Core',tips:['Set a bench to a slight decline, feet hooked under the pad. Hold a light plate or DB at your chest.','Curl up one vertebra at a time — do not just hinge from the hips like a rigid board.','At the top, squeeze the abs briefly before lowering with control.','Lower slowly — 2-3 seconds — all the way back to the bench. Do not let the weight and gravity yank you down.','Keep the weight light. This is a core exercise, not a loaded strength lift — form breaks down fast if you go heavy.','No neck strain — hands support the weight at your chest, not pulling on your head or neck.']},
  'Kettlebell Swing':{muscle:'Glute / Hamstring / Hip Hinge',category:'Hinge',tips:['Feet shoulder-width, kettlebell on the floor slightly ahead of you. Hinge down and grip it with both hands.','The power comes from a hip hinge and hip snap — this is NOT a squat and NOT an arm movement.','Hike the kettlebell back between your legs like a football snap, then drive your hips forward explosively.','The kettlebell should float up to chest height from hip drive alone — arms are just along for the ride.','IMPORTANT for your shoulder: chest height MAXIMUM. Do not let it rise overhead — that turns this into an overhead movement.','Shoulders packed down throughout, not shrugged up toward the ears.','Exhale sharply on the drive. Never hold your breath through the movement.']},
  'Seated Calf Raise (KB on knee)':{muscle:'Soleus (Seated Bias)',category:'Calf',tips:['Sit on a bench, feet flat on the floor, a kettlebell balanced on top of each knee (or one KB across both).','Keeping the knees bent throughout shifts the emphasis onto the soleus rather than the gastrocnemius.','Rise up onto the balls of your feet as high as possible. Squeeze at the top for 1 second.','Lower slowly over 2-3 seconds into a full stretch, heels as low as your set-up allows.','Balance the kettlebell carefully — a folded towel on the knee helps stop it rolling.','Bilateral load, no ankle twisting — safe within the current foot/ankle constraints.']},
  'Band Straight-Arm Pulldown':{muscle:'Lat',category:'Pull',tips:['Anchor a band high (door anchor or overhead point). Stand facing the anchor, arms extended straight in front of you.','Keeping the arms straight throughout, pull the band down and back until your hands reach your thighs.','The key cue: feel this entirely in the lats, not the triceps or shoulders. If your elbows bend, you have turned it into a different exercise.','Squeeze the lats hard at the bottom of the movement for 1 second.','Control the return — do not let the band snap your arms back up.','This teaches a pure lat-pull pattern with zero trap involvement — an excellent pairing with heavier rows that tend to recruit the traps.']},
  'Suitcase Carry (bilateral)':{muscle:'Core (Anti-Lateral-Flexion) / Grip / Traps (Isometric)',category:'Core',tips:['Hold a DB in each hand at your sides, standing tall, as if carrying two suitcases.','Walk forward in a straight line, taking controlled, deliberate steps.','The core challenge is resisting any side-to-side lean — brace hard and keep the torso dead upright.','No twisting through the trunk with each step. Small, controlled strides beat long ones here.','Shoulders packed down and back — do not let the weight round you forward.','Bilateral loading (both hands) keeps this stable and symmetrical — ideal given the current ankle constraint on rotational loads.','30m per set is plenty. Quality of bracing matters more than distance.']},
  'Band Pull-Apart':{muscle:'Rear Delt / Rhomboid / Mid Trap',category:'Warm-Up',tips:['Hold a light resistance band with both hands, arms extended straight in front of you at chest height.','Pull the band apart by driving the hands out to the sides, leading with the elbows.','Critical cue: shoulder blades pull DOWN and together, not up toward the ears. This is a warm-up for the rear delts and mid-back, not a shrug.','Squeeze the shoulder blades together at the end range for a moment before returning with control.','Keep the arms nearly straight throughout — a slight elbow bend is fine, but this is not a rowing motion.','Excellent low-load activator to do before any pressing or pulling work.']},
  'Scapular Wall Slides':{muscle:'Serratus Anterior / Lower Trap / Rotator Cuff',category:'Warm-Up',tips:['Stand with your back against a wall, arms in a goalpost position (elbows and wrists touching the wall).','Slowly slide your arms up the wall as high as comfortable, keeping elbows and wrists in contact with the wall throughout.','Stop at the first sign of the lower back arching off the wall or the shoulder losing contact — that is your current pain-free ceiling.','Slide back down with control. The lower back and forearms should stay glued to the wall the entire time.','This is deliberately slow and low-intensity — it is priming the shoulder blade to move properly, not a strength exercise.','For your right shoulder: expect asymmetry between sides. Never force the right arm to match the left arm range.']},
  'Band Face Pulls':{muscle:'Rear Delt / Rotator Cuff / Mid Trap',category:'Warm-Up',tips:['Anchor a band at roughly face height. Hold with both hands, arms extended toward the anchor.','Pull the band toward your face, aiming to finish with your hands either side of your nose.','Lead with the elbows, keeping them high — around shoulder height throughout the pull.','Critical cue: shoulders stay DOWN, not shrugged up, as the band comes toward your face.','Externally rotate slightly at the end of the pull — hands finish just past your ears, thumbs pointing back.','This is one of the best all-round shoulder-health movements available. Light band, high reps, perfect form.']},
  '90/90 Diaphragmatic Breathing':{muscle:'Deep Core / Diaphragm',category:'Warm-Up',tips:['Lie on your back, hips and knees bent to 90 degrees each, calves resting on a chair or bench.','Place one hand on your belly, one on your chest. The belly hand should move more than the chest hand.','Inhale slowly through the nose, feeling the belly and lower ribs expand outward and to the sides — not the chest rising.','Exhale slowly and fully through the mouth, feeling the ribs drop and the lower back gently flatten into the floor.','This resets the diaphragm and deep core before loading the spine — particularly valuable for the APT correction pattern.','Slow and unhurried. Rushing the breath defeats the purpose entirely.']},
  'Leg Swings':{muscle:'Hip Mobility (Dynamic)',category:'Warm-Up',tips:['Hold a wall or rack for balance. Swing one leg forward and back in a controlled arc, letting the range build over reps.','Keep the torso upright and the core braced — the movement is at the hip, not the lower back.','Do a set front-to-back, then turn side-on and swing the same leg across your body and out (lateral swings).','Start with small swings and progressively increase the range — never force a cold hip into end range.','This primes the hip flexors, hamstrings, and adductors dynamically before squatting or hinging.','10 each direction per leg. Smooth and rhythmic, not ballistic.']},
  'Inchworm Walkout':{muscle:'Hamstring / Core / Shoulder (Dynamic)',category:'Warm-Up',tips:['Stand tall, hinge at the hips and place your hands on the floor (bend the knees as needed).','Walk your hands forward until you reach a plank position, keeping the core braced the whole way out.','Hold the plank for a beat, then walk the hands back toward the feet and stand up.','This dynamically warms the hamstrings, opens the shoulders, and switches on the deep core in one movement.','Keep the hips from sagging in the plank position — brace as if bracing for the working sets to come.','5 slow reps. Move deliberately through each phase rather than rushing.']},
};

const WARMUP_COACHING={
  '5 Min Light Cardio':{muscle:'Full Body / Cardiovascular',category:'Warm-Up',tips:['Bike, row, or brisk walk — purpose is to raise core temperature and heart rate gently.','Keep intensity low. You should be able to hold a conversation throughout.','This primes blood flow to the muscles you are about to train. Do not skip it.','Especially important first thing in the morning when joints and muscles are stiff.']},
  'Hip Circles':{muscle:'Hip / Glute / Lumbar',category:'Warm-Up',tips:['Hands on hips or holding a wall. Make slow, deliberate circles with the hips.','Gradually increase the range of motion as the joint warms up.','Do both directions — the stiff direction tells you where mobility work is needed.','This lubricates the hip joint and activates the glute medius before lower body work.']},
  'Leg Swings (Front / Back)':{muscle:'Hip Flexor / Hamstring',category:'Warm-Up',tips:['Stand side-on to a wall, hold it for balance.','Swing the leg forward and back in a controlled arc — let it reach full range without forcing.','Keep your torso upright and still throughout. Only the leg moves.','10 swings front-to-back on each leg. Dynamically lengthens the hip flexors and hamstrings.']},
  'Glute Bridge (Warm-Up)':{muscle:'Glute / Hamstring / Core',category:'Warm-Up',tips:['Lie on your back, knees bent, feet flat on the floor.','Drive through your heels and squeeze the glutes to lift the hips.','Hold at the top for 1 second — feel the glutes fire, not the lower back.','This is activation, not loading. Keep it controlled and intentional.']},
